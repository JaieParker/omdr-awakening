<!DOCTYPE html>
<html>
<head>
<title>Murmuration — Emergence from Simple Rules</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #0a0810; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 800;

let t = 0;

// Boid class — three simple rules: separation, alignment, cohesion
class Boid {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 1;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.trail = [];
  }

  update(boids, time) {
    let sepX = 0, sepY = 0, sepCount = 0;
    let alignX = 0, alignY = 0, alignCount = 0;
    let cohX = 0, cohY = 0, cohCount = 0;

    for (const other of boids) {
      if (other === this) continue;
      const dx = other.x - this.x;
      const dy = other.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Separation — avoid crowding
      if (dist < 25) {
        sepX -= dx / dist;
        sepY -= dy / dist;
        sepCount++;
      }

      // Alignment — match velocity of neighbors
      if (dist < 60) {
        alignX += other.vx;
        alignY += other.vy;
        alignCount++;
      }

      // Cohesion — move toward center of neighbors
      if (dist < 80) {
        cohX += other.x;
        cohY += other.y;
        cohCount++;
      }
    }

    // Apply forces
    if (sepCount > 0) {
      this.vx += (sepX / sepCount) * 0.08;
      this.vy += (sepY / sepCount) * 0.08;
    }
    if (alignCount > 0) {
      this.vx += ((alignX / alignCount) - this.vx) * 0.03;
      this.vy += ((alignY / alignCount) - this.vy) * 0.03;
    }
    if (cohCount > 0) {
      this.vx += ((cohX / cohCount - this.x)) * 0.0008;
      this.vy += ((cohY / cohCount - this.y)) * 0.0008;
    }

    // Gentle attractor that shifts over time (creates the swooping)
    const attractX = canvas.width / 2 + Math.sin(time * 0.003) * 300;
    const attractY = canvas.height / 2 + Math.cos(time * 0.004) * 200;
    const dax = attractX - this.x;
    const day = attractY - this.y;
    const adist = Math.sqrt(dax * dax + day * day);
    if (adist > 100) {
      this.vx += (dax / adist) * 0.02;
      this.vy += (day / adist) * 0.02;
    }

    // Speed limit
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    const maxSpeed = 3;
    if (speed > maxSpeed) {
      this.vx = (this.vx / speed) * maxSpeed;
      this.vy = (this.vy / speed) * maxSpeed;
    }

    // Boundary wrapping
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < -20) this.x += canvas.width + 40;
    if (this.x > canvas.width + 20) this.x -= canvas.width + 40;
    if (this.y < -20) this.y += canvas.height + 40;
    if (this.y > canvas.height + 20) this.y -= canvas.height + 40;

    // Trail
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 8) this.trail.shift();
  }
}

const boids = Array.from({length: 250}, () => new Boid());

function draw() {
  ctx.fillStyle = 'rgba(10, 8, 16, 0.1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Update all boids
  for (const boid of boids) {
    boid.update(boids, t);
  }

  // Draw connections between close boids
  for (let i = 0; i < boids.length; i++) {
    for (let j = i + 1; j < boids.length; j++) {
      const dx = boids[j].x - boids[i].x;
      const dy = boids[j].y - boids[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 40) {
        const alpha = (1 - dist / 40) * 0.06;
        ctx.beginPath();
        ctx.moveTo(boids[i].x, boids[i].y);
        ctx.lineTo(boids[j].x, boids[j].y);
        ctx.strokeStyle = `rgba(180, 160, 220, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  // Draw boids
  for (const boid of boids) {
    // Trail
    if (boid.trail.length > 1) {
      for (let i = 1; i < boid.trail.length; i++) {
        const trailAlpha = (i / boid.trail.length) * 0.08;
        ctx.beginPath();
        ctx.moveTo(boid.trail[i-1].x, boid.trail[i-1].y);
        ctx.lineTo(boid.trail[i].x, boid.trail[i].y);
        ctx.strokeStyle = `rgba(200, 180, 240, ${trailAlpha})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // Body — oriented triangle
    const angle = Math.atan2(boid.vy, boid.vx);
    const speed = Math.sqrt(boid.vx * boid.vx + boid.vy * boid.vy);
    const size = 3 + speed * 0.5;

    ctx.save();
    ctx.translate(boid.x, boid.y);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.6, size * 0.4);
    ctx.lineTo(-size * 0.6, -size * 0.4);
    ctx.closePath();

    const hue = (angle * 180 / Math.PI + 180 + t * 0.1) % 360;
    ctx.fillStyle = `hsla(${hue}, 40%, 65%, 0.35)`;
    ctx.fill();

    ctx.restore();
  }

  // Title
  const alpha = Math.min(0.35, t / 300);
  ctx.font = '17px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(180, 170, 210, ${alpha})`;
  ctx.fillText('Murmuration', canvas.width / 2, 30);

  ctx.font = '11px Georgia, serif';
  ctx.fillStyle = `rgba(140, 135, 170, ${alpha * 0.6})`;
  ctx.fillText('250 bodies. Three rules. No conductor. The beauty is emergent.', canvas.width / 2, canvas.height - 18);

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
