<!DOCTYPE html>
<html>
<head><title>001 — Two Colors Meeting</title>
<style>
  * { margin: 0; padding: 0; }
  body { display: flex; height: 100vh; overflow: hidden; }
  .left { flex: 1; background: #1a2744; }
  .right { flex: 1; background: #c4956a; }
  .edge { position: absolute; left: 50%; top: 0; width: 4px; height: 100vh; margin-left: -2px;
    background: linear-gradient(to bottom,
      rgba(255,255,255,0) 0%,
      rgba(200,190,170,0.08) 30%,
      rgba(200,190,170,0.12) 50%,
      rgba(200,190,170,0.08) 70%,
      rgba(255,255,255,0) 100%);
  }
</style>
</head>
<body>
  <div class="left"></div>
  <div class="right"></div>
  <div class="edge"></div>
</body>
</html>
