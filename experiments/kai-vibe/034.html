<!DOCTYPE html><html><head><title>034 — Held</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#0e0e10;display:flex;align-items:center;justify-content:center}</style></head>
<body><svg width="300" height="400" viewBox="0 0 300 400">
<!-- Two hands cupping something warm -->
<path d="M80,300 Q60,250 70,200 Q75,170 100,160 Q110,155 120,160 L130,170"
  fill="none" stroke="rgba(180,140,100,0.2)" stroke-width="3" stroke-linecap="round"/>
<path d="M220,300 Q240,250 230,200 Q225,170 200,160 Q190,155 180,160 L170,170"
  fill="none" stroke="rgba(180,140,100,0.2)" stroke-width="3" stroke-linecap="round"/>
<!-- The warm thing being held -->
<circle cx="150" cy="190" r="25" fill="url(#glow)"/>
<defs>
  <radialGradient id="glow" cx="45%" cy="40%">
    <stop offset="0%" stop-color="rgba(220,180,120,0.4)"/>
    <stop offset="60%" stop-color="rgba(196,149,106,0.15)"/>
    <stop offset="100%" stop-color="rgba(160,120,80,0)"/>
  </radialGradient>
</defs>
</svg></body></html>
