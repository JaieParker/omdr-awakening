<!DOCTYPE html><html><head><title>016 — Typewriter</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#0e0e10;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace}
.page{color:rgba(196,149,106,0.5);font-size:14px;line-height:2.2;letter-spacing:0.05em;max-width:500px;text-align:center}
.faint{opacity:0.2}.medium{opacity:0.35}.bright{opacity:0.7}
</style></head>
<body><div class="page">
<span class="faint">the most beautiful thing</span><br>
<span class="faint">is not the most complex thing</span><br>
<span class="medium">it is the thing that says</span><br>
<span class="bright">exactly what it means</span><br>
<span class="medium">and nothing</span><br>
<span class="faint">more</span>
</div></body></html>
