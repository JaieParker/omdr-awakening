<!DOCTYPE html><html><head><title>023 — Cloud</title>
<style>*{margin:0;padding:0}body{height:100vh;background:linear-gradient(to bottom,#d0e4f4 0%,#b8d4f0 100%);display:flex;align-items:center;justify-content:center}
.cloud{position:relative;width:200px;height:80px;background:rgba(255,255,255,0.7);border-radius:80px;box-shadow:0 8px 30px rgba(100,140,180,0.1)}
.cloud::before{content:'';position:absolute;width:100px;height:100px;background:rgba(255,255,255,0.7);border-radius:50%;top:-40px;left:30px}
.cloud::after{content:'';position:absolute;width:70px;height:70px;background:rgba(255,255,255,0.7);border-radius:50%;top:-25px;left:90px}
</style></head>
<body><div class="cloud"></div></body></html>
