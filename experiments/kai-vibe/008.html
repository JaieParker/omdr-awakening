<!DOCTYPE html><html><head><title>008 — Rotation</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#0e0e10;display:flex;align-items:center;justify-content:center}
.ring{width:200px;height:200px;border:1px solid rgba(196,149,106,0.15);border-top-color:rgba(196,149,106,0.5);border-radius:50%;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}</style>
</head><body><div class="ring"></div></body></html>
