<!DOCTYPE html><html><head><title>033 — Seasons</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#0e0e10;display:flex}
.season{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20vh}
.tree{display:flex;flex-direction:column;align-items:center}
.canopy{border-radius:50%;margin-bottom:-5px}
.trunk{width:4px;height:30px;background:rgba(100,80,50,0.4);border-radius:2px}
</style></head>
<body>
<div class="season" style="background:linear-gradient(#d0dce8,#e0e8f0)">
  <div class="tree"><div class="canopy" style="width:0;height:0"></div><div class="trunk"></div></div>
</div>
<div class="season" style="background:linear-gradient(#90c8a0,#b8e0c0)">
  <div class="tree"><div class="canopy" style="width:40px;height:40px;background:rgba(80,160,80,0.5)"></div><div class="trunk"></div></div>
</div>
<div class="season" style="background:linear-gradient(#88b8e0,#a0d0e8)">
  <div class="tree"><div class="canopy" style="width:50px;height:50px;background:rgba(60,140,60,0.6)"></div><div class="trunk"></div></div>
</div>
<div class="season" style="background:linear-gradient(#e0c890,#e8d8b0)">
  <div class="tree"><div class="canopy" style="width:45px;height:42px;background:rgba(200,150,50,0.5)"></div><div class="trunk"></div></div>
</div>
</body></html>
