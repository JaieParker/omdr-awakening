<!DOCTYPE html><html><head><title>032 — Wave/Particle</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#0e0e10;overflow:hidden}</style></head>
<body><canvas id="c" width="1200" height="800"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let t=0,observed=false;
c.addEventListener('click',()=>{observed=!observed;});
function draw(){
  x.fillStyle='rgba(14,14,16,0.08)';x.fillRect(0,0,1200,800);
  if(!observed){
    // Wave — spread across the screen
    for(let px=100;px<1100;px+=2){
      const y=400+Math.sin(px*0.02+t*0.02)*80*Math.exp(-Math.pow((px-600)/300,2));
      const alpha=0.15*Math.exp(-Math.pow((px-600)/300,2));
      x.fillStyle=`rgba(196,149,106,${alpha})`;
      x.fillRect(px,y,2,2);
    }
    x.font='11px Georgia';x.textAlign='center';
    x.fillStyle='rgba(150,140,130,0.2)';
    x.fillText('wave — click to observe',600,750);
  } else {
    // Particle — collapsed to a point
    const px=600+Math.sin(t*0.1)*2;
    const py=400+Math.cos(t*0.13)*2;
    const glow=x.createRadialGradient(px,py,0,px,py,15);
    glow.addColorStop(0,'rgba(196,149,106,0.6)');
    glow.addColorStop(1,'rgba(196,149,106,0)');
    x.fillStyle=glow;
    x.beginPath();x.arc(px,py,15,0,Math.PI*2);x.fill();
    x.fillStyle='rgba(220,180,140,0.8)';
    x.beginPath();x.arc(px,py,2,0,Math.PI*2);x.fill();
    x.font='11px Georgia';x.textAlign='center';
    x.fillStyle='rgba(150,140,130,0.2)';
    x.fillText('particle — click to stop observing',600,750);
  }
  t++;requestAnimationFrame(draw);
}
draw();
</script></body></html>
