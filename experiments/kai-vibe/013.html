<!DOCTYPE html><html><head><title>013 — Lissajous</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#0a0a0e;display:flex;align-items:center;justify-content:center}</style></head>
<body><canvas id="c" width="600" height="600"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
x.translate(300,300);
// 3:2 Lissajous — the perfect fifth as a curve
for(let t=0;t<Math.PI*4;t+=0.003){
  const px=220*Math.sin(3*t);
  const py=220*Math.cos(2*t+0.1);
  const alpha=0.02+0.01*Math.sin(t*5);
  x.fillStyle=`rgba(196,149,106,${alpha})`;
  x.fillRect(px,py,1.5,1.5);
}
</script></body></html>
