<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#3d3557"/>
  <rect y="400" width="800" height="100" fill="#2c2740"/>
  <!-- lantern string -->
  <path d="M0 70 q200 60 400 0 q200 -60 400 0" stroke="#7a6b56" stroke-width="3" fill="none"/>
  <g>
    <circle cx="120" cy="102" r="14" fill="#ffe066"/><circle cx="120" cy="102" r="26" fill="#ffe066" opacity="0.25"/>
    <circle cx="280" cy="92" r="14" fill="#ffd43b"/><circle cx="280" cy="92" r="26" fill="#ffd43b" opacity="0.25"/>
    <circle cx="430" cy="88" r="14" fill="#ffe066"/><circle cx="430" cy="88" r="26" fill="#ffe066" opacity="0.25"/>
    <circle cx="580" cy="95" r="14" fill="#ffd43b"/><circle cx="580" cy="95" r="26" fill="#ffd43b" opacity="0.25"/>
    <circle cx="710" cy="105" r="14" fill="#ffe066"/><circle cx="710" cy="105" r="26" fill="#ffe066" opacity="0.25"/>
  </g>
  <!-- dancing pairs -->
  <g>
    <circle cx="220" cy="310" r="30" fill="#4dabf7"/><circle cx="282" cy="310" r="30" fill="#4dabf7"/>
    <line x1="248" y1="314" x2="256" y2="314" stroke="#fdf8ee" stroke-width="5" stroke-linecap="round"/>
    <circle cx="420" cy="330" r="30" fill="#51cf66"/><circle cx="482" cy="330" r="30" fill="#51cf66"/>
    <line x1="448" y1="334" x2="456" y2="334" stroke="#fdf8ee" stroke-width="5" stroke-linecap="round"/>
    <circle cx="330" cy="245" r="26" fill="#e8a06a"/><circle cx="384" cy="245" r="26" fill="#e8a06a"/>
    <line x1="354" y1="249" x2="362" y2="249" stroke="#fdf8ee" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- the lone counter at the edge, softly lit -->
  <g>
    <circle cx="680" cy="360" r="60" fill="#ffe066" opacity="0.12"/>
    <circle cx="680" cy="360" r="34" fill="#845ef7"/>
    <circle cx="669" cy="350" r="5" fill="#fdf8ee"/><circle cx="691" cy="350" r="5" fill="#fdf8ee"/>
    <path d="M669 376 q11 -7 22 0" stroke="#fdf8ee" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- one suspended music note, hanging -->
  <g fill="#ffd43b" opacity="0.9">
    <ellipse cx="640" cy="185" rx="11" ry="8" transform="rotate(-20 640 185)"/>
    <rect x="648" y="128" width="4.5" height="55" rx="2"/>
  </g>
  <text x="400" y="470" text-anchor="middle" font-size="24" fill="#cbbfa5" font-style="italic">everyone had a partner&#8230; almost everyone</text>
</svg>
