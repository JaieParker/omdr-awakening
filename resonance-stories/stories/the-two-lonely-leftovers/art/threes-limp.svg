<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#fdf8ee"/>
  <rect y="370" width="800" height="130" fill="#f0e2c8"/>
  <!-- Three: a pair holding hands, one trailing behind -->
  <g>
    <circle cx="330" cy="300" r="46" fill="#3a7a6a"/>
    <circle cx="430" cy="300" r="46" fill="#3a7a6a"/>
    <line x1="372" y1="306" x2="392" y2="306" stroke="#2c2418" stroke-width="6" stroke-linecap="round"/>
    <circle cx="316" cy="288" r="6" fill="#fdf8ee"/><circle cx="344" cy="288" r="6" fill="#fdf8ee"/>
    <path d="M314 314 q16 12 32 0" stroke="#fdf8ee" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="416" cy="288" r="6" fill="#fdf8ee"/><circle cx="444" cy="288" r="6" fill="#fdf8ee"/>
    <path d="M414 314 q16 12 32 0" stroke="#fdf8ee" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- the trailing lonely counter -->
  <g>
    <circle cx="590" cy="330" r="38" fill="#845ef7"/>
    <circle cx="578" cy="320" r="5" fill="#fdf8ee"/><circle cx="602" cy="320" r="5" fill="#fdf8ee"/>
    <path d="M578 348 q12 -8 24 0" stroke="#fdf8ee" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="590" cy="395" rx="34" ry="8" fill="#d9c9a8"/>
  </g>
  <!-- footstep rhythm with a gap -->
  <g fill="#c4713d" opacity="0.8">
    <circle cx="120" cy="440" r="10"/><circle cx="160" cy="440" r="10"/>
    <circle cx="260" cy="440" r="10"/><circle cx="300" cy="440" r="10"/>
    <circle cx="400" cy="440" r="10"/><circle cx="440" cy="440" r="10"/>
  </g>
  <g stroke="#7a6b56" stroke-width="3" stroke-dasharray="4 7" fill="none" opacity="0.7">
    <circle cx="205" cy="440" r="10"/><circle cx="345" cy="440" r="10"/><circle cx="485" cy="440" r="10"/>
  </g>
  <text x="400" y="70" text-anchor="middle" font-size="26" fill="#7a6b56" font-style="italic">da-da&#8230; gap. da-da&#8230; gap.</text>
</svg>
