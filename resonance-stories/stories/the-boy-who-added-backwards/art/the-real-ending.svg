<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#1d2438"/>
  <!-- stars, orbits, equations around the grown Gauss -->
  <g fill="#f2e9d8">
    <circle cx="90" cy="70" r="2.5"/><circle cx="210" cy="45" r="2"/><circle cx="340" cy="80" r="2.5"/>
    <circle cx="480" cy="50" r="2"/><circle cx="610" cy="75" r="2.5"/><circle cx="720" cy="45" r="2"/>
    <circle cx="120" cy="380" r="2"/><circle cx="700" cy="400" r="2.5"/>
  </g>
  <ellipse cx="400" cy="250" rx="290" ry="115" fill="none" stroke="#48607e" stroke-width="2.5" stroke-dasharray="5 9"/>
  <circle cx="640" cy="180" r="10" fill="#ffd43b"/>
  <g font-size="20" fill="#8d94a8" font-style="italic">
    <text x="90" y="180">n(n+1)/2</text>
    <text x="620" y="330">17-gon</text>
    <text x="120" y="330">&#8721;</text>
  </g>
  <!-- the boy and the man, side by side -->
  <g>
    <!-- boy -->
    <circle cx="300" cy="230" r="40" fill="#e8b48a"/>
    <path d="M264 218 q36 -30 72 0 l-4 -20 q-32 -17 -64 0 z" fill="#c98d3c"/>
    <circle cx="286" cy="226" r="6" fill="#2c2418"/><circle cx="314" cy="226" r="6" fill="#2c2418"/>
    <path d="M288 250 q12 9 24 0" stroke="#2c2418" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="268" y="272" width="64" height="60" rx="12" fill="#3a7a6a"/>
    <!-- the man (portrait style) -->
    <circle cx="500" cy="225" r="46" fill="#e8b48a"/>
    <path d="M458 210 q42 -36 84 0 l-3 -14 q-16 -12 -30 -14 q10 10 -8 8 q-20 -4 -43 6 z" fill="#8d8677"/>
    <circle cx="484" cy="222" r="6" fill="#2c2418"/><circle cx="516" cy="222" r="6" fill="#2c2418"/>
    <path d="M486 248 q14 8 28 0" stroke="#2c2418" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="462" y="270" width="76" height="66" rx="12" fill="#2c2740"/>
    <path d="M462 282 l38 24 l38 -24" stroke="#f2e9d8" stroke-width="4" fill="none"/>
  </g>
  <path d="M352 250 q48 -30 96 -22" stroke="#ffd43b" stroke-width="3" stroke-dasharray="3 8" fill="none" stroke-linecap="round"/>
  <text x="400" y="60" text-anchor="middle" font-size="25" fill="#e8dcc0" font-style="italic">Carl Friedrich Gauss &#8212; this really happened</text>
  <text x="400" y="430" text-anchor="middle" font-size="24" fill="#b8c4d4">he stopped&#8230; and listened to what the numbers were already doing</text>
</svg>
