<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#e8dcc4"/>
  <!-- sunbeam with chalk dust -->
  <polygon points="620,0 800,0 800,300 500,500 430,500" fill="#f7ecd2" opacity="0.7"/>
  <g fill="#d9cba8" opacity="0.8">
    <circle cx="600" cy="120" r="3"/><circle cx="640" cy="180" r="2.5"/><circle cx="570" cy="240" r="3"/>
    <circle cx="660" cy="290" r="2.5"/><circle cx="540" cy="330" r="3"/><circle cx="610" cy="380" r="2.5"/>
  </g>
  <!-- blackboard -->
  <rect x="60" y="60" width="330" height="180" rx="8" fill="#2e3d34" stroke="#5c4326" stroke-width="8"/>
  <text x="225" y="130" text-anchor="middle" font-size="30" fill="#e8dcc4" font-family="cursive">1 + 2 + 3 + &#8230; + 100</text>
  <text x="225" y="185" text-anchor="middle" font-size="22" fill="#b8c9be" font-style="italic">nobody speaks until it's done</text>
  <!-- teacher with newspaper -->
  <g>
    <circle cx="640" cy="270" r="34" fill="#e8b48a"/>
    <path d="M612 258 q28 -22 56 0 l-4 -18 q-24 -14 -48 0 z" fill="#8d8677"/>
    <rect x="596" y="304" width="88" height="120" rx="16" fill="#5c4326"/>
    <rect x="560" y="330" width="110" height="80" rx="6" fill="#f2ecdc" transform="rotate(-8 615 370)"/>
    <g stroke="#8d8677" stroke-width="3" transform="rotate(-8 615 370)">
      <line x1="572" y1="348" x2="656" y2="348"/><line x1="572" y1="362" x2="656" y2="362"/>
      <line x1="572" y1="376" x2="640" y2="376"/>
    </g>
  </g>
  <!-- wooden desks with hunched children -->
  <g>
    <rect x="80" y="360" width="130" height="16" rx="4" fill="#8a6a44"/>
    <rect x="90" y="376" width="12" height="60" fill="#75593a"/><rect x="188" y="376" width="12" height="60" fill="#75593a"/>
    <circle cx="145" cy="330" r="26" fill="#e8b48a"/>
    <path d="M121 322 q24 -20 48 0 l-2 -14 q-22 -12 -44 0 z" fill="#5c4326"/>
    <rect x="255" y="380" width="130" height="16" rx="4" fill="#8a6a44"/>
    <rect x="265" y="396" width="12" height="52" fill="#75593a"/><rect x="363" y="396" width="12" height="52" fill="#75593a"/>
    <circle cx="320" cy="350" r="26" fill="#d9a05b"/>
    <path d="M296 342 q24 -20 48 0 l-2 -14 q-22 -12 -44 0 z" fill="#3d2c17"/>
  </g>
  <!-- ticking clock -->
  <circle cx="470" cy="100" r="34" fill="#fffdf4" stroke="#5c4326" stroke-width="5"/>
  <line x1="470" y1="100" x2="470" y2="78" stroke="#2c2418" stroke-width="4" stroke-linecap="round"/>
  <line x1="470" y1="100" x2="486" y2="108" stroke="#2c2418" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="480" text-anchor="middle" font-size="24" fill="#5c5240" font-style="italic">Germany, 1780s &#8212; the longest, most boring task in the world</text>
</svg>
