<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#e8dcc4"/>
  <!-- frozen sunbeam dust -->
  <polygon points="560,0 800,0 800,260 470,500 420,500" fill="#f7ecd2" opacity="0.6"/>
  <g fill="#d9cba8">
    <circle cx="580" cy="140" r="3"/><circle cx="630" cy="200" r="2.5"/><circle cx="550" cy="260" r="3"/>
    <circle cx="650" cy="320" r="2.5"/><circle cx="520" cy="360" r="3"/>
  </g>
  <!-- extreme close-up: teacher's eyes over spectacles -->
  <g>
    <ellipse cx="400" cy="180" rx="330" ry="150" fill="#e8b48a"/>
    <!-- spectacles -->
    <circle cx="255" cy="200" r="85" fill="#fffdf4" stroke="#5c4326" stroke-width="8"/>
    <circle cx="545" cy="200" r="85" fill="#fffdf4" stroke="#5c4326" stroke-width="8"/>
    <line x1="340" y1="195" x2="460" y2="195" stroke="#5c4326" stroke-width="8"/>
    <!-- wide eyes looking down at slate -->
    <circle cx="255" cy="212" r="30" fill="#2c2418"/><circle cx="264" cy="203" r="9" fill="#fffdf4"/>
    <circle cx="545" cy="212" r="30" fill="#2c2418"/><circle cx="554" cy="203" r="9" fill="#fffdf4"/>
    <!-- raised eyebrows -->
    <path d="M185 105 q70 -34 140 -6" stroke="#8d8677" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M475 99 q70 -28 140 6" stroke="#8d8677" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  <!-- the slate held up -->
  <g>
    <rect x="290" y="345" width="220" height="120" rx="8" fill="#2e3d34" stroke="#5c4326" stroke-width="7"/>
    <text x="400" y="425" text-anchor="middle" font-size="52" fill="#fffdf4" font-family="cursive">5050</text>
  </g>
  <text x="400" y="55" text-anchor="middle" font-size="25" fill="#5c5240" font-style="italic">the quiet went very, very loud</text>
</svg>
