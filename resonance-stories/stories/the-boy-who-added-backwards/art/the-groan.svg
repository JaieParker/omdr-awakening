<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#e8dcc4"/>
  <!-- a staircase of numbers getting steeper and wobblier -->
  <g fill="#8a6a44">
    <rect x="80" y="420" width="90" height="40" rx="4"/>
    <rect x="170" y="385" width="90" height="75" rx="4" opacity="0.95"/>
    <rect x="260" y="340" width="90" height="120" rx="4" opacity="0.9"/>
    <rect x="350" y="280" width="90" height="180" rx="4" opacity="0.85" transform="rotate(2 395 370)"/>
    <rect x="440" y="205" width="90" height="255" rx="4" opacity="0.8" transform="rotate(-3 485 330)"/>
    <rect x="530" y="115" width="90" height="345" rx="4" opacity="0.75" transform="rotate(4 575 287)"/>
  </g>
  <g font-size="30" fill="#fdf8ee" font-weight="bold" text-anchor="middle">
    <text x="125" y="447">3</text>
    <text x="215" y="415">6</text>
    <text x="305" y="372">10</text>
    <text x="395" y="315">15</text>
    <text x="485" y="242">21</text>
    <text x="575" y="155">28</text>
  </g>
  <text x="668" y="120" font-size="34" fill="#5c5240">&#8230;?</text>
  <!-- exhausted child at the bottom with slate -->
  <g>
    <circle cx="120" cy="330" r="28" fill="#e8b48a"/>
    <path d="M94 322 q26 -22 52 0 l-2 -15 q-24 -13 -48 0 z" fill="#5c4326"/>
    <ellipse cx="112" cy="326" rx="4" ry="6" fill="#2c2418"/><ellipse cx="130" cy="326" rx="4" ry="6" fill="#2c2418"/>
    <path d="M110 348 q11 -7 22 0" stroke="#2c2418" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="70" y="372" width="100" height="70" rx="6" fill="#2e3d34" stroke="#5c4326" stroke-width="5"/>
    <g font-size="14" fill="#b8c9be" font-family="cursive">
      <text x="84" y="398">1+2=3</text><text x="84" y="416">+3=6</text><text x="84" y="432">+4=10&#8230;</text>
    </g>
  </g>
  <text x="400" y="60" text-anchor="middle" font-size="26" fill="#5c5240" font-style="italic">the numbers piled up like a staircase that kept getting steeper</text>
</svg>
