<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#fdf8ee"/>
  <!-- paper on a desk -->
  <rect y="240" width="800" height="260" fill="#e8d3ae"/>
  <rect x="120" y="180" width="560" height="260" rx="10" fill="#fffdf4" stroke="#d9cba8" stroke-width="3" transform="rotate(-1.5 400 310)"/>
  <!-- child's hand drawing an arc -->
  <g transform="rotate(-1.5 400 310)">
    <g font-size="30" text-anchor="middle" fill="#2c2418" font-family="cursive">
      <text x="180" y="390">1</text><text x="228" y="390">2</text><text x="276" y="390">3</text>
      <text x="324" y="390">4</text><text x="372" y="390">5</text><text x="420" y="390">6</text>
      <text x="468" y="390">7</text><text x="516" y="390">8</text><text x="564" y="390">9</text><text x="616" y="390">10</text>
    </g>
    <!-- completed arcs glow -->
    <path d="M180 358 q218 -190 436 0" stroke="#c4713d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M228 358 q168 -140 336 0" stroke="#3a7a6a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- arc being drawn now, pencil at its tip -->
    <path d="M276 358 q100 -95 150 -45" stroke="#845ef7" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="1 0"/>
  </g>
  <!-- pencil -->
  <g transform="rotate(38 448 300)">
    <rect x="430" y="290" width="120" height="18" rx="4" fill="#ffd43b"/>
    <polygon points="430,290 408,299 430,308" fill="#e8b48a"/>
    <polygon points="414,296 408,299 414,302" fill="#2c2418"/>
    <rect x="550" y="290" width="16" height="18" rx="4" fill="#e8a2b8"/>
  </g>
  <!-- chime marks on completed arcs -->
  <g fill="#ffd43b">
    <circle cx="398" cy="255" r="16"/><circle cx="396" cy="282" r="12"/>
  </g>
  <g font-size="15" fill="#5c4326" font-weight="bold" text-anchor="middle">
    <text x="398" y="260">11</text><text x="396" y="286">11</text>
  </g>
  <text x="400" y="70" text-anchor="middle" font-size="30" fill="#2c2418" font-weight="bold">Your turn &#8212; draw the rainbow</text>
  <text x="400" y="110" text-anchor="middle" font-size="23" fill="#7a6b56" font-style="italic">pair the ends until every number has a partner. what does every arc make?</text>
  <text x="400" y="478" text-anchor="middle" font-size="23" fill="#845ef7" font-weight="bold">ready for the big leagues? try 1 to 20&#8230;</text>
</svg>
