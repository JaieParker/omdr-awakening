<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#f3ecd8"/>
  <!-- great calendar wheel -->
  <circle cx="400" cy="270" r="180" fill="#fffdf4" stroke="#8a6a44" stroke-width="6"/>
  <circle cx="400" cy="270" r="12" fill="#8a6a44"/>
  <!-- 12 year ticks -->
  <g stroke="#b8a37e" stroke-width="3">
    <line x1="400" y1="98" x2="400" y2="122"/><line x1="486" y1="121" x2="474" y2="142"/>
    <line x1="549" y1="184" x2="528" y2="196"/><line x1="572" y1="270" x2="548" y2="270"/>
    <line x1="549" y1="356" x2="528" y2="344"/><line x1="486" y1="419" x2="474" y2="398"/>
    <line x1="400" y1="442" x2="400" y2="418"/><line x1="314" y1="419" x2="326" y2="398"/>
    <line x1="251" y1="356" x2="272" y2="344"/><line x1="228" y1="270" x2="252" y2="270"/>
    <line x1="251" y1="184" x2="272" y2="196"/><line x1="314" y1="121" x2="326" y2="142"/>
  </g>
  <!-- tiger paw lands on years 4, 8, 12 -->
  <g fill="#d97b29">
    <g transform="translate(548,270)">
      <ellipse rx="17" ry="13"/><circle cx="-11" cy="-14" r="5"/><circle cx="0" cy="-17" r="5"/><circle cx="11" cy="-14" r="5"/>
    </g>
    <g transform="translate(400,418)">
      <ellipse rx="17" ry="13"/><circle cx="-11" cy="-14" r="5"/><circle cx="0" cy="-17" r="5"/><circle cx="11" cy="-14" r="5"/>
    </g>
    <g transform="translate(400,122)">
      <ellipse rx="17" ry="13"/><circle cx="-11" cy="-14" r="5"/><circle cx="0" cy="-17" r="5"/><circle cx="11" cy="-14" r="5"/>
    </g>
  </g>
  <!-- cicada wakes at 12 — same spot as a paw! -->
  <g>
    <ellipse cx="400" cy="152" rx="22" ry="19" fill="#c9a13b"/>
    <circle cx="393" cy="148" r="3.5" fill="#2c2418"/><circle cx="407" cy="148" r="3.5" fill="#2c2418"/>
    <path d="M393 160 q7 -5 14 0" stroke="#2c2418" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- collision flash -->
    <g stroke="#e03131" stroke-width="4" stroke-linecap="round">
      <line x1="358" y1="110" x2="342" y2="94"/><line x1="442" y1="110" x2="458" y2="94"/>
      <line x1="358" y1="190" x2="342" y2="206"/><line x1="442" y1="190" x2="458" y2="206"/>
    </g>
  </g>
  <text x="400" y="285" text-anchor="middle" font-size="40" fill="#8a6a44" font-weight="bold">12 = 4 &#215; 3</text>
  <text x="400" y="60" text-anchor="middle" font-size="25" fill="#5c5240" font-style="italic">every single waking&#8230; BOOM. the tiger was already there</text>
</svg>
