<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#eaf2fb"/>
  <!-- failed attempts, small sketches -->
  <g>
    <text x="140" y="90" text-anchor="middle" font-size="22" fill="#5c6a7a">3 rows?</text>
    <g fill="#845ef7">
      <circle cx="105" cy="120" r="12"/><circle cx="140" cy="120" r="12"/>
      <circle cx="105" cy="152" r="12"/><circle cx="140" cy="152" r="12"/>
      <circle cx="105" cy="184" r="12"/><circle cx="140" cy="184" r="12"/>
    </g>
    <circle cx="185" cy="152" r="12" fill="#e03131"/>
    <text x="212" y="160" font-size="24" fill="#e03131" font-weight="bold">&#10007;</text>
  </g>
  <g>
    <text x="400" y="90" text-anchor="middle" font-size="22" fill="#5c6a7a">4 rows?</text>
    <g fill="#845ef7">
      <circle cx="375" cy="118" r="11"/><circle cx="405" cy="118" r="11"/>
      <circle cx="375" cy="146" r="11"/><circle cx="405" cy="146" r="11"/>
      <circle cx="375" cy="174" r="11"/><circle cx="405" cy="174" r="11"/>
    </g>
    <circle cx="390" cy="205" r="11" fill="#e03131"/>
    <text x="440" y="160" font-size="24" fill="#e03131" font-weight="bold">&#10007;</text>
  </g>
  <g>
    <text x="650" y="90" text-anchor="middle" font-size="22" fill="#5c6a7a">5 rows?</text>
    <g fill="#845ef7">
      <circle cx="630" cy="118" r="11"/><circle cx="660" cy="118" r="11"/>
      <circle cx="630" cy="146" r="11"/><circle cx="660" cy="146" r="11"/>
      <circle cx="630" cy="174" r="11"/>
    </g>
    <g fill="#e03131"><circle cx="660" cy="174" r="11"/><circle cx="645" cy="203" r="11"/></g>
    <text x="695" y="160" font-size="24" fill="#e03131" font-weight="bold">&#10007;</text>
  </g>
  <!-- the long lonely single-file line under the palace walls -->
  <rect y="300" width="800" height="60" fill="#c9b98a" opacity="0.5"/>
  <g fill="#845ef7" stroke="#6741d9" stroke-width="2">
    <circle cx="120" cy="400" r="22"/><circle cx="212" cy="400" r="22"/><circle cx="304" cy="400" r="22"/>
    <circle cx="396" cy="400" r="22"/><circle cx="488" cy="400" r="22"/><circle cx="580" cy="400" r="22"/>
    <circle cx="672" cy="400" r="22"/>
  </g>
  <g fill="#fdf8ee">
    <circle cx="113" cy="395" r="3.5"/><circle cx="127" cy="395" r="3.5"/>
    <circle cx="205" cy="395" r="3.5"/><circle cx="219" cy="395" r="3.5"/>
    <circle cx="297" cy="395" r="3.5"/><circle cx="311" cy="395" r="3.5"/>
    <circle cx="389" cy="395" r="3.5"/><circle cx="403" cy="395" r="3.5"/>
    <circle cx="481" cy="395" r="3.5"/><circle cx="495" cy="395" r="3.5"/>
    <circle cx="573" cy="395" r="3.5"/><circle cx="587" cy="395" r="3.5"/>
    <circle cx="665" cy="395" r="3.5"/><circle cx="679" cy="395" r="3.5"/>
  </g>
  <g stroke="#fdf8ee" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M113 410 q7 -5 14 0"/><path d="M205 410 q7 -5 14 0"/><path d="M297 410 q7 -5 14 0"/>
    <path d="M389 410 q7 -5 14 0"/><path d="M481 410 q7 -5 14 0"/><path d="M573 410 q7 -5 14 0"/>
    <path d="M665 410 q7 -5 14 0"/>
  </g>
  <text x="400" y="470" text-anchor="middle" font-size="25" fill="#5c6a7a" font-style="italic">the longest, thinnest parade anyone had ever seen</text>
</svg>
