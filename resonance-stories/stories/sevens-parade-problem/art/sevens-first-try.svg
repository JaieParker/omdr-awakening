<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#eaf2fb"/>
  <rect y="330" width="800" height="170" fill="#d9e6f2"/>
  <!-- Seven trying two rows: 3+3 and one sticking out -->
  <g fill="#845ef7" stroke="#6741d9" stroke-width="3">
    <circle cx="270" cy="290" r="34"/><circle cx="370" cy="290" r="34"/><circle cx="470" cy="290" r="34"/>
    <circle cx="270" cy="380" r="34"/><circle cx="370" cy="380" r="34"/><circle cx="470" cy="380" r="34"/>
  </g>
  <!-- the loose soldier, sticking out the back, hat askew -->
  <g>
    <circle cx="590" cy="336" r="34" fill="#845ef7" stroke="#6741d9" stroke-width="3"/>
    <rect x="562" y="282" width="42" height="18" rx="4" fill="#2c2418" transform="rotate(-18 583 291)"/>
    <circle cx="580" cy="328" r="5" fill="#fdf8ee"/><circle cx="600" cy="328" r="5" fill="#fdf8ee"/>
    <path d="M580 350 q10 -6 20 0" stroke="#fdf8ee" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- sweat drop -->
    <path d="M622 300 q8 12 0 18 q-8 -6 0 -18" fill="#4dabf7"/>
  </g>
  <!-- neat faces on the rows -->
  <g fill="#fdf8ee">
    <circle cx="260" cy="282" r="5"/><circle cx="280" cy="282" r="5"/>
    <circle cx="360" cy="282" r="5"/><circle cx="380" cy="282" r="5"/>
    <circle cx="460" cy="282" r="5"/><circle cx="480" cy="282" r="5"/>
  </g>
  <!-- hanging unresolved note -->
  <g fill="#e03131" opacity="0.85">
    <ellipse cx="655" cy="150" rx="11" ry="8" transform="rotate(-20 655 150)"/>
    <rect x="663" y="95" width="4.5" height="55" rx="2"/>
    <text x="690" y="120" font-size="30" fill="#e03131">?</text>
  </g>
  <text x="400" y="70" text-anchor="middle" font-size="30" fill="#2c2418" font-weight="bold">7 = 3 + 3 + &#8230; one left over</text>
  <text x="400" y="465" text-anchor="middle" font-size="25" fill="#5c6a7a" font-style="italic">like a loose tooth. the crowd tittered.</text>
</svg>
