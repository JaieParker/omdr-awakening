<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#fdf8ee"/>
  <rect y="210" width="800" height="290" fill="#e8d3ae"/>
  <!-- seven biscuits mid-attempt -->
  <g>
    <text x="220" y="170" text-anchor="middle" font-size="26" fill="#7a6b56" font-style="italic">7 biscuits&#8230; try every rectangle</text>
    <g fill="#d9a05b" stroke="#b97f3c" stroke-width="4">
      <circle cx="120" cy="270" r="30"/><circle cx="190" cy="270" r="30"/><circle cx="260" cy="270" r="30"/>
      <circle cx="120" cy="345" r="30"/><circle cx="190" cy="345" r="30"/><circle cx="260" cy="345" r="30"/>
      <circle cx="330" cy="308" r="30"/>
    </g>
    <g fill="#8a5a28">
      <circle cx="112" cy="262" r="3.5"/><circle cx="130" cy="276" r="3.5"/><circle cx="182" cy="264" r="3.5"/>
      <circle cx="200" cy="278" r="3.5"/><circle cx="252" cy="262" r="3.5"/><circle cx="270" cy="276" r="3.5"/>
      <circle cx="112" cy="337" r="3.5"/><circle cx="130" cy="351" r="3.5"/><circle cx="182" cy="339" r="3.5"/>
      <circle cx="200" cy="353" r="3.5"/><circle cx="252" cy="337" r="3.5"/><circle cx="270" cy="351" r="3.5"/>
      <circle cx="322" cy="300" r="3.5"/><circle cx="340" cy="314" r="3.5"/>
    </g>
    <text x="330" y="380" text-anchor="middle" font-size="30" fill="#e03131" font-weight="bold">?</text>
  </g>
  <!-- magnifying glass over 1..20 -->
  <g>
    <rect x="450" y="240" width="300" height="150" rx="14" fill="#fffdf4" stroke="#3a7a6a" stroke-width="3"/>
    <g font-size="24" fill="#2c2418">
      <text x="480" y="285">1</text><text x="515" y="285" fill="#c4713d" font-weight="bold">2</text><text x="550" y="285" fill="#c4713d" font-weight="bold">3</text><text x="585" y="285">4</text><text x="622" y="285" fill="#c4713d" font-weight="bold">5</text>
      <text x="657" y="285">6</text><text x="688" y="285" fill="#c4713d" font-weight="bold">7</text>
      <text x="480" y="325">8</text><text x="515" y="325">9</text><text x="546" y="325">10</text><text x="592" y="325">11</text><text x="638" y="325">12</text><text x="684" y="325">13</text>
      <text x="480" y="365">14</text><text x="526" y="365">15</text><text x="572" y="365">16</text><text x="618" y="365">17</text><text x="664" y="365">18</text><text x="706" y="365">&#8230;</text>
    </g>
    <circle cx="600" cy="310" r="58" fill="none" stroke="#845ef7" stroke-width="6"/>
    <line x1="642" y1="352" x2="690" y2="405" stroke="#845ef7" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="400" y="70" text-anchor="middle" font-size="30" fill="#2c2418" font-weight="bold">Your turn, detective</text>
  <text x="400" y="110" text-anchor="middle" font-size="24" fill="#7a6b56" font-style="italic">which numbers up to twenty are locksmith numbers? there are eight&#8230;</text>
  <text x="600" y="450" text-anchor="middle" font-size="23" fill="#845ef7" font-weight="bold">can you find them all?</text>
</svg>
