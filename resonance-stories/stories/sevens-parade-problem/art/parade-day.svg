<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, serif">
  <rect width="800" height="500" fill="#eaf2fb"/>
  <!-- golden palace -->
  <g>
    <rect x="290" y="140" width="220" height="180" fill="#f2d98c"/>
    <rect x="270" y="120" width="50" height="200" fill="#e8c96a"/>
    <rect x="480" y="120" width="50" height="200" fill="#e8c96a"/>
    <polygon points="270,120 295,70 320,120" fill="#c4713d"/>
    <polygon points="480,120 505,70 530,120" fill="#c4713d"/>
    <polygon points="290,140 400,80 510,140" fill="#d9a83c"/>
    <rect x="378" y="240" width="44" height="80" rx="20" fill="#8a5a28"/>
    <rect x="315" y="180" width="30" height="42" rx="12" fill="#fdf8ee"/>
    <rect x="455" y="180" width="30" height="42" rx="12" fill="#fdf8ee"/>
  </g>
  <!-- bunting -->
  <path d="M0 60 q200 50 400 10 q200 -40 400 30" stroke="#c4713d" stroke-width="3" fill="none"/>
  <g>
    <polygon points="90,72 104,72 97,94" fill="#e03131"/>
    <polygon points="200,86 214,86 207,108" fill="#3a7a6a"/>
