  </g>
  <!-- parade ground -->
  <rect y="320" width="800" height="180" fill="#d9e6f2"/>
  <!-- numbers lining up with marching hats -->
  <g>
    <g transform="translate(120,400)">
      <circle r="26" fill="#4dabf7"/><rect x="-16" y="-42" width="32" height="16" rx="4" fill="#2c2418"/>
      <circle cx="-8" cy="-4" r="4" fill="#fdf8ee"/><circle cx="8" cy="-4" r="4" fill="#fdf8ee"/>
      <path d="M-8 10 q8 6 16 0" stroke="#fdf8ee" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(230,410)">
      <circle r="26" fill="#51cf66"/><rect x="-16" y="-42" width="32" height="16" rx="4" fill="#2c2418"/>
      <circle cx="-8" cy="-4" r="4" fill="#fdf8ee"/><circle cx="8" cy="-4" r="4" fill="#fdf8ee"/>
      <path d="M-8 10 q8 6 16 0" stroke="#fdf8ee" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(560,405)">
      <circle r="26" fill="#e8a06a"/><rect x="-16" y="-42" width="32" height="16" rx="4" fill="#2c2418"/>
      <circle cx="-8" cy="-4" r="4" fill="#fdf8ee"/><circle cx="8" cy="-4" r="4" fill="#fdf8ee"/>
      <path d="M-8 10 q8 6 16 0" stroke="#fdf8ee" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(670,398)">
      <circle r="26" fill="#845ef7"/><rect x="-16" y="-42" width="32" height="16" rx="4" fill="#2c2418"/>
      <circle cx="-8" cy="-4" r="4" fill="#fdf8ee"/><circle cx="8" cy="-4" r="4" fill="#fdf8ee"/>
      <path d="M-8 10 q8 6 16 0" stroke="#fdf8ee" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <text x="400" y="365" text-anchor="middle" font-size="26" fill="#5c6a7a" font-style="italic">the rule was simple: march in a perfect rectangle</text>
</svg>
