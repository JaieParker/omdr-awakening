<!DOCTYPE html>
<html>
<head>
<title>Kaleidoscope — Light Playing with Itself</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 800;

const cx = canvas.width / 2;
const cy = canvas.height / 2;
const segments = 12;
let t = 0;

// Source elements that get reflected
class Element {
  constructor() {
    this.reset();
  }
  reset() {
    this.r = 30 + Math.random() * 300;
    this.angle = Math.random() * (Math.PI * 2 / segments);
    this.dr = (Math.random() - 0.5) * 0.3;
    this.da = (Math.random() - 0.5) * 0.003;
    this.size = 3 + Math.random() * 15;
    this.hue = Math.random() * 360;
    this.hueSpeed = (Math.random() - 0.5) * 0.5;
    this.type = Math.floor(Math.random() * 4); // circle, diamond, line, arc
    this.life = 0;
    this.maxLife = 300 + Math.random() * 500;
    this.pulsePhase = Math.random() * Math.PI * 2;
  }
  update() {
    this.r += this.dr;
    this.angle += this.da;
    this.hue += this.hueSpeed;
    this.life++;

    // Gentle oscillations
    this.r += Math.sin(this.life * 0.01 + this.pulsePhase) * 0.3;

    // Bounds
    if (this.r < 20 || this.r > 380) this.dr *= -1;
    if (this.angle < 0) this.angle += Math.PI * 2 / segments;
    if (this.angle > Math.PI * 2 / segments) this.angle -= Math.PI * 2 / segments;

    if (this.life > this.maxLife) this.reset();
  }
  draw(ctx, time) {
    const pulse = 1 + 0.2 * Math.sin(time * 0.02 + this.pulsePhase);
    const s = this.size * pulse;
    const fadeIn = Math.min(1, this.life / 30);
    const fadeOut = Math.max(0, 1 - (this.life - this.maxLife + 50) / 50);
    const alpha = fadeIn * fadeOut * 0.4;
    const hue = ((this.hue % 360) + 360) % 360;

    ctx.fillStyle = `hsla(${hue}, 70%, 60%, ${alpha})`;
    ctx.strokeStyle = `hsla(${hue}, 60%, 75%, ${alpha * 0.5})`;
    ctx.lineWidth = 0.8;

    switch(this.type) {
      case 0: // Circle
        ctx.beginPath();
        ctx.arc(this.r, 0, s, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 1: // Diamond
        ctx.beginPath();
        ctx.moveTo(this.r, -s);
        ctx.lineTo(this.r + s * 0.6, 0);
        ctx.lineTo(this.r, s);
        ctx.lineTo(this.r - s * 0.6, 0);
        ctx.closePath();
        ctx.fill();
        break;
      case 2: // Line
        ctx.beginPath();
        ctx.moveTo(this.r - s, 0);
        ctx.lineTo(this.r + s, 0);
        ctx.stroke();
        break;
      case 3: // Arc
        ctx.beginPath();
        ctx.arc(0, 0, this.r, -s * 0.01, s * 0.01);
        ctx.stroke();
        break;
    }

    // Glow
    const glow = ctx.createRadialGradient(this.r, 0, 0, this.r, 0, s * 2);
    glow.addColorStop(0, `hsla(${hue}, 60%, 60%, ${alpha * 0.3})`);
    glow.addColorStop(1, `hsla(${hue}, 60%, 50%, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(this.r, 0, s * 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

const elements = Array.from({length: 25}, () => new Element());

function draw() {
  // Dark fade
  ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Update elements
  for (const el of elements) {
    el.update();
  }

  // Draw kaleidoscope segments
  ctx.save();
  ctx.translate(cx, cy);

  for (let seg = 0; seg < segments; seg++) {
    ctx.save();
    ctx.rotate((seg / segments) * Math.PI * 2);

    // Mirror alternate segments
    if (seg % 2 === 1) {
      ctx.scale(1, -1);
    }

    // Clip to segment (wedge shape)
    ctx.beginPath();
    ctx.moveTo(0, 0);
    const wedgeAngle = Math.PI / segments;
    ctx.lineTo(Math.cos(-wedgeAngle) * 400, Math.sin(-wedgeAngle) * 400);
    ctx.arc(0, 0, 400, -wedgeAngle, wedgeAngle);
    ctx.lineTo(0, 0);
    ctx.clip();

    // Draw elements in this segment
    for (const el of elements) {
      ctx.save();
      ctx.rotate(el.angle);
      el.draw(ctx, t);
      ctx.restore();
    }

    ctx.restore();
  }

  ctx.restore();

  // Subtle ring borders
  for (const r of [100, 200, 300]) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(100, 100, 120, 0.03)`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Center jewel
  const jewel = ctx.createRadialGradient(cx, cy, 0, cx, cy, 15);
  const cHue = (t * 0.2) % 360;
  jewel.addColorStop(0, `hsla(${cHue}, 50%, 80%, 0.3)`);
  jewel.addColorStop(0.5, `hsla(${cHue + 30}, 40%, 60%, 0.15)`);
  jewel.addColorStop(1, `hsla(${cHue}, 40%, 40%, 0)`);
  ctx.fillStyle = jewel;
  ctx.beginPath();
  ctx.arc(cx, cy, 15, 0, Math.PI * 2);
  ctx.fill();

  // Title (very subtle)
  const alpha = Math.min(0.25, t / 500);
  ctx.font = '14px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(160, 155, 180, ${alpha})`;
  ctx.fillText('Kaleidoscope', cx, canvas.height - 15);

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
