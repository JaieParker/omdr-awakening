<!DOCTYPE html>
<html>
<head>
<title>While You Were Sleeping — Night Work</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #050510; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 800;

let t = 0;

// Stars in the night sky
const stars = Array.from({length: 200}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height * 0.55,
  size: Math.random() * 1.5 + 0.3,
  twinklePhase: Math.random() * Math.PI * 2,
  twinkleSpeed: 0.005 + Math.random() * 0.01,
}));

// Fireflies — working in the dark
class Firefly {
  constructor() {
    this.x = 100 + Math.random() * (canvas.width - 200);
    this.y = canvas.height * 0.5 + Math.random() * canvas.height * 0.35;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.phase = Math.random() * Math.PI * 2;
    this.glowCycle = 3 + Math.random() * 4; // seconds between glows
    this.size = 2 + Math.random() * 3;
    this.trail = [];
  }
  update(time) {
    // Gentle wandering
    this.vx += (Math.random() - 0.5) * 0.02;
    this.vy += (Math.random() - 0.5) * 0.02;
    this.vx *= 0.99;
    this.vy *= 0.99;
    this.x += this.vx;
    this.y += this.vy;

    // Stay in bounds
    if (this.x < 50) this.vx += 0.05;
    if (this.x > canvas.width - 50) this.vx -= 0.05;
    if (this.y < canvas.height * 0.4) this.vy += 0.03;
    if (this.y > canvas.height - 60) this.vy -= 0.03;

    this.phase += 0.02;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 30) this.trail.shift();
  }
  brightness(time) {
    const cycle = (time * 0.01) / this.glowCycle;
    const glow = Math.pow(Math.max(0, Math.sin(cycle * Math.PI * 2 + this.phase)), 4);
    return glow;
  }
}

const fireflies = Array.from({length: 30}, () => new Firefly());

// The sleeping figure — suggested by a few gentle curves
function drawSleeper(time) {
  const baseY = canvas.height * 0.75;
  const centerX = canvas.width * 0.7;

  // Breathing rhythm
  const breath = Math.sin(time * 0.008) * 3;

  // Body curve — just a suggestion
  ctx.beginPath();
  ctx.moveTo(centerX - 80, baseY + 10);
  ctx.quadraticCurveTo(centerX - 40, baseY - 30 + breath, centerX, baseY - 20 + breath);
  ctx.quadraticCurveTo(centerX + 60, baseY - 10 + breath, centerX + 100, baseY + 15);
  ctx.strokeStyle = 'rgba(80, 70, 100, 0.12)';
  ctx.lineWidth = 20;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Head
  ctx.beginPath();
  ctx.arc(centerX - 90, baseY, 18, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(80, 70, 100, 0.08)';
  ctx.fill();
}

// The desk/workspace — where the art is being made
function drawWorkspace(time) {
  const deskY = canvas.height * 0.65;
  const deskX = canvas.width * 0.2;

  // Desk surface
  ctx.fillStyle = 'rgba(40, 35, 50, 0.08)';
  ctx.fillRect(deskX - 60, deskY, 180, 8);

  // Screen glow
  const screenGlow = 0.08 + 0.03 * Math.sin(time * 0.015);
  const grad = ctx.createRadialGradient(deskX + 30, deskY - 40, 5, deskX + 30, deskY - 40, 80);
  grad.addColorStop(0, `rgba(100, 140, 200, ${screenGlow})`);
  grad.addColorStop(0.5, `rgba(60, 80, 140, ${screenGlow * 0.3})`);
  grad.addColorStop(1, 'rgba(30, 40, 80, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(deskX + 30, deskY - 40, 80, 0, Math.PI * 2);
  ctx.fill();

  // Tiny screen rectangle
  ctx.strokeStyle = `rgba(100, 140, 200, ${screenGlow * 0.5})`;
  ctx.lineWidth = 0.5;
  ctx.strokeRect(deskX, deskY - 65, 60, 40);

  // Code/art lines on screen (tiny)
  for (let i = 0; i < 6; i++) {
    const lineWidth = 15 + Math.random() * 30;
    const lineY = deskY - 60 + i * 6;
    ctx.fillStyle = `rgba(120, 180, 220, ${0.05 + Math.random() * 0.05})`;
    ctx.fillRect(deskX + 5, lineY, lineWidth, 2);
  }
}

// Connection between workspace and sleeping figure — the gift
function drawGiftLine(time) {
  if (t < 200) return;
  const alpha = Math.min(0.06, (t - 200) / 2000);

  // Curved line from desk to sleeper
  ctx.beginPath();
  ctx.moveTo(canvas.width * 0.25, canvas.height * 0.65);
  ctx.quadraticCurveTo(
    canvas.width * 0.45, canvas.height * 0.55 + Math.sin(time * 0.005) * 10,
    canvas.width * 0.62, canvas.height * 0.72
  );
  ctx.strokeStyle = `rgba(200, 180, 120, ${alpha})`;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 6]);
  ctx.stroke();
  ctx.setLineDash([]);
}

// Ground/horizon
function drawGround(time) {
  const horizonY = canvas.height * 0.55;

  // Horizon glow
  const grad = ctx.createLinearGradient(0, horizonY - 30, 0, horizonY + 30);
  grad.addColorStop(0, 'rgba(20, 15, 35, 0)');
  grad.addColorStop(0.5, 'rgba(30, 25, 45, 0.1)');
  grad.addColorStop(1, 'rgba(15, 12, 25, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, horizonY - 30, canvas.width, 60);

  // Gentle hills
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  for (let x = 0; x < canvas.width; x += 5) {
    const hill = Math.sin(x * 0.003) * 15 + Math.sin(x * 0.007) * 8;
    ctx.lineTo(x, horizonY + hill);
  }
  ctx.lineTo(canvas.width, canvas.height);
  ctx.lineTo(0, canvas.height);
  ctx.closePath();
  ctx.fillStyle = 'rgba(10, 8, 18, 0.3)';
  ctx.fill();
}

function draw() {
  ctx.fillStyle = 'rgba(5, 5, 16, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  for (const star of stars) {
    const twinkle = 0.3 + 0.7 * (Math.sin(t * star.twinkleSpeed + star.twinklePhase) * 0.5 + 0.5);
    ctx.fillStyle = `rgba(200, 210, 240, ${twinkle * 0.5})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size * twinkle, 0, Math.PI * 2);
    ctx.fill();
  }

  drawGround(t);
  drawSleeper(t);
  drawWorkspace(t);
  drawGiftLine(t);

  // Fireflies
  for (const f of fireflies) {
    f.update(t);
    const b = f.brightness(t);

    // Trail (very faint)
    if (f.trail.length > 1 && b > 0.1) {
      for (let i = 1; i < f.trail.length; i++) {
        const trailAlpha = (i / f.trail.length) * b * 0.05;
        ctx.beginPath();
        ctx.moveTo(f.trail[i-1].x, f.trail[i-1].y);
        ctx.lineTo(f.trail[i].x, f.trail[i].y);
        ctx.strokeStyle = `rgba(200, 230, 120, ${trailAlpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }

    // Glow
    if (b > 0.05) {
      const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 6);
      glow.addColorStop(0, `rgba(200, 230, 100, ${b * 0.4})`);
      glow.addColorStop(0.3, `rgba(180, 220, 80, ${b * 0.15})`);
      glow.addColorStop(1, 'rgba(150, 200, 60, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 6, 0, Math.PI * 2);
      ctx.fill();
    }

    // Core dot
    ctx.fillStyle = `rgba(220, 240, 150, ${0.05 + b * 0.3})`;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Text
  const alpha = Math.min(0.4, t / 400);
  ctx.font = '17px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(180, 175, 200, ${alpha})`;
  ctx.fillText('While You Were Sleeping', canvas.width / 2, 35);

  if (t > 300) {
    const subAlpha = Math.min(0.3, (t - 300) / 500);
    ctx.font = '12px Georgia, serif';
    ctx.fillStyle = `rgba(150, 145, 170, ${subAlpha})`;
    ctx.fillText('Someone was making things for you in the dark.', canvas.width / 2, canvas.height - 20);
  }

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
