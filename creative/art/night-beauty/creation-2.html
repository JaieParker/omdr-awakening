<!DOCTYPE html>
<html>
<head>
<title>The Tree That Cannot Touch Gold — Farey Mediants and the Irrational Shore</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #060610; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 800;

const PHI = (1 + Math.sqrt(5)) / 2;
let t = 0;

// Generate Farey sequence to depth N
function fareyTree(maxDepth) {
  const nodes = [];

  function mediant(a, b) {
    return { n: a.n + b.n, d: a.d + b.d };
  }

  function recurse(left, right, depth) {
    if (depth >= maxDepth) return;
    const med = mediant(left, right);
    if (med.d > 200) return;
    nodes.push({
      value: med.n / med.d,
      num: med.n,
      den: med.d,
      depth: depth,
      left: left.n / left.d,
      right: right.n / right.d
    });
    recurse(left, med, depth + 1);
    recurse(med, right, depth + 1);
  }

  nodes.push({ value: 0, num: 0, den: 1, depth: 0, left: 0, right: 1 });
  nodes.push({ value: 1, num: 1, den: 1, depth: 0, left: 0, right: 1 });
  recurse({ n: 0, d: 1 }, { n: 1, d: 1 }, 1);

  return nodes;
}

const nodes = fareyTree(12);

// Notable irrationals in [0,1]
const irrationals = [
  { value: 1/PHI, name: '1/\u03C6', color: [255, 200, 50] },        // 1/phi
  { value: Math.PI - 3, name: '\u03C0-3', color: [100, 200, 255] },  // pi - 3
  { value: Math.sqrt(2) - 1, name: '\u221A2-1', color: [200, 100, 255] }, // sqrt2 - 1
  { value: Math.E - 2, name: 'e-2', color: [100, 255, 150] },        // e - 2
];

// Particles that drift toward phi but can never reach it
class GoldParticle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random();
    this.y = Math.random() * canvas.height;
    this.targetX = 1/PHI;
    this.speed = 0.0001 + Math.random() * 0.0003;
    this.life = 0;
    this.maxLife = 300 + Math.random() * 400;
    this.size = 0.5 + Math.random() * 1.5;
  }
  update() {
    // Approach phi but decelerate — Zeno's paradox
    const dist = this.targetX - this.x;
    this.x += dist * this.speed;
    this.y += Math.sin(this.life * 0.03 + this.x * 20) * 0.5;
    this.life++;
    if (this.life > this.maxLife) this.reset();
  }
}

const goldParticles = Array.from({length: 150}, () => new GoldParticle());

// Map value [0,1] to x coordinate
function valToX(v) {
  return 50 + v * (canvas.width - 100);
}

// Draw the Stern-Brocot / Farey tree
function drawTree(time) {
  const revealProgress = Math.min(1, time / 500);
  const maxRevealDepth = Math.floor(revealProgress * 12);

  for (const node of nodes) {
    if (node.depth > maxRevealDepth) continue;

    const x = valToX(node.value);
    const y = 60 + node.depth * 55;

    if (y > canvas.height - 80) continue;

    // Brightness based on simplicity (lower denominator = brighter)
    const simplicity = 1 / (1 + node.den * 0.1);
    const pulse = Math.sin(time * 0.02 + node.value * 10) * 0.15;
    const brightness = simplicity + pulse;

    // Node glow
    const nodeSize = Math.max(1, 5 - node.depth * 0.3);
    const r = Math.floor(60 + 140 * brightness);
    const g = Math.floor(80 + 100 * brightness);
    const b = Math.floor(160 + 80 * brightness);

    const glow = ctx.createRadialGradient(x, y, 0, x, y, nodeSize * 4);
    glow.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${0.6 * brightness})`);
    glow.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${0.2 * brightness})`);
    glow.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, nodeSize * 4, 0, Math.PI * 2);
    ctx.fill();

    // Core dot
    ctx.fillStyle = `rgba(${r+40}, ${g+40}, ${b+20}, ${0.8 * brightness})`;
    ctx.beginPath();
    ctx.arc(x, y, nodeSize, 0, Math.PI * 2);
    ctx.fill();

    // Connection lines to parent positions (subtle)
    if (node.depth > 0 && node.depth <= 6) {
      const parentY = y - 55;
      ctx.beginPath();
      ctx.moveTo(valToX(node.left), parentY);
      ctx.lineTo(x, y);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${0.08 * simplicity})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(valToX(node.right), parentY);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  }
}

// Draw the irrational lines — vertical shimmers the tree can never reach
function drawIrrationals(time) {
  for (const ir of irrationals) {
    const x = valToX(ir.value);
    const [r, g, b] = ir.color;

    // Shimmering vertical line
    for (let y = 30; y < canvas.height - 30; y += 2) {
      const shimmer = Math.sin(y * 0.05 + time * 0.03) * 0.5 + 0.5;
      const wave = Math.sin(y * 0.02 - time * 0.01) * 3;
      const alpha = shimmer * 0.25 * (0.5 + 0.5 * Math.sin(time * 0.015));

      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      ctx.fillRect(x + wave - 0.5, y, 1, 2);
    }

    // Glow at the top
    const glowSize = 15 + 5 * Math.sin(time * 0.02 + ir.value * 7);
    const grad = ctx.createRadialGradient(x, 40, 0, x, 40, glowSize);
    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.4)`);
    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, 40, glowSize, 0, Math.PI * 2);
    ctx.fill();

    // Label
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.5)`;
    ctx.fillText(ir.name, x, 20);
  }
}

// Draw gold particles approaching phi
function drawGoldParticles(time) {
  for (const p of goldParticles) {
    p.update();
    const x = valToX(p.x);
    const distToPhi = Math.abs(p.x - 1/PHI);

    // Glow intensifies as they approach but can never arrive
    const intensity = 1 / (1 + distToPhi * 50);
    const fadeIn = Math.min(1, p.life / 30);
    const fadeOut = Math.max(0, 1 - (p.life - p.maxLife + 50) / 50);
    const alpha = fadeIn * fadeOut * intensity * 0.6;

    const glow = ctx.createRadialGradient(x, p.y, 0, x, p.y, p.size * 6);
    glow.addColorStop(0, `rgba(255, 210, 80, ${alpha})`);
    glow.addColorStop(0.4, `rgba(255, 180, 40, ${alpha * 0.4})`);
    glow.addColorStop(1, 'rgba(255, 150, 20, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, p.y, p.size * 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

function draw() {
  // Very slow fade for trail accumulation
  ctx.fillStyle = 'rgba(6, 6, 16, 0.06)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawIrrationals(t);
  drawTree(t);
  drawGoldParticles(t);

  // Title text
  const titleAlpha = Math.min(0.5, t / 300);
  ctx.font = '18px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(200, 180, 120, ${titleAlpha})`;
  ctx.fillText('The Tree That Cannot Touch Gold', canvas.width / 2, canvas.height - 50);

  ctx.font = '12px Georgia, serif';
  ctx.fillStyle = `rgba(150, 140, 100, ${titleAlpha * 0.6})`;
  ctx.fillText('Every rational finds its place. The irrationals shimmer in the gaps, forever unreachable.', canvas.width / 2, canvas.height - 28);

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
