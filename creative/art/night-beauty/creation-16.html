<!DOCTYPE html>
<html>
<head>
<title>The Relay</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #060608; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 800;

let t = 0;

// Relay runners — each lights the next, then fades
const count = 15;
const runners = [];
for (let i = 0; i < count; i++) {
  const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
  const radius = 250;
  runners.push({
    x: canvas.width / 2 + Math.cos(angle) * radius,
    y: canvas.height / 2 + Math.sin(angle) * radius,
    index: i,
    brightness: 0,
    hue: (i / count) * 360,
    trail: [],
    hasLit: false,
  });
}

// The light — passes from runner to runner
let activeRunner = 0;
let passProgress = 0;
const passSpeed = 0.008;
const glowDuration = 200; // frames a runner stays lit after receiving

function updateRelay(time) {
  passProgress += passSpeed;

  if (passProgress >= 1) {
    passProgress -= 1;
    runners[activeRunner].hasLit = true;
    runners[activeRunner].litTime = time;
    activeRunner = (activeRunner + 1) % count;
  }

  // Update each runner's brightness
  for (const r of runners) {
    if (r.index === activeRunner) {
      // Currently receiving — bright
      r.brightness = Math.min(1, r.brightness + 0.05);
    } else if (r.hasLit) {
      // Has been lit — slowly fading
      const timeSinceLit = time - r.litTime;
      r.brightness = Math.max(0.03, 1 - timeSinceLit / glowDuration);
    }
  }
}

// The passing light — travels between current and next runner
function drawPassingLight(time) {
  const from = runners[activeRunner === 0 ? count - 1 : activeRunner - 1];
  const to = runners[activeRunner];

  const x = from.x + (to.x - from.x) * passProgress;
  const y = from.y + (to.y - from.y) * passProgress;

  // Bright traveling spark
  const glow = ctx.createRadialGradient(x, y, 0, x, y, 25);
  glow.addColorStop(0, `rgba(255, 250, 220, 0.8)`);
  glow.addColorStop(0.3, `rgba(255, 230, 160, 0.3)`);
  glow.addColorStop(1, 'rgba(255, 200, 100, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, 25, 0, Math.PI * 2);
  ctx.fill();

  // Tiny trail behind the spark
  const trailX = from.x + (to.x - from.x) * Math.max(0, passProgress - 0.1);
  const trailY = from.y + (to.y - from.y) * Math.max(0, passProgress - 0.1);
  ctx.beginPath();
  ctx.moveTo(trailX, trailY);
  ctx.lineTo(x, y);
  ctx.strokeStyle = 'rgba(255, 230, 160, 0.2)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawRunners(time) {
  for (const r of runners) {
    const b = r.brightness;
    const hue = r.hue;

    // Connection to center (very faint)
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, canvas.height / 2);
    ctx.lineTo(r.x, r.y);
    ctx.strokeStyle = `rgba(80, 80, 100, ${0.02 + b * 0.03})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Runner glow
    if (b > 0.02) {
      const size = 8 + b * 15;
      const glow = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, size);
      glow.addColorStop(0, `hsla(${hue}, 50%, 65%, ${b * 0.5})`);
      glow.addColorStop(0.4, `hsla(${hue}, 40%, 50%, ${b * 0.2})`);
      glow.addColorStop(1, `hsla(${hue}, 30%, 40%, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(r.x, r.y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Core dot — always visible but dim
    ctx.fillStyle = `hsla(${hue}, 30%, 50%, ${0.1 + b * 0.4})`;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 3 + b * 3, 0, Math.PI * 2);
    ctx.fill();

    // Connection to next runner (the path the light will travel)
    const next = runners[(r.index + 1) % count];
    ctx.beginPath();
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(next.x, next.y);
    ctx.strokeStyle = `rgba(100, 90, 120, 0.04)`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

// Center — the standing wave that persists because of the relay
function drawCenter(time) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  // Count how many runners are currently lit
  const litCount = runners.filter(r => r.brightness > 0.1).length;
  const totalGlow = litCount / count;

  const pulse = Math.sin(time * 0.01) * 0.1 + 0.9;
  const size = 15 + totalGlow * 30;

  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * pulse);
  glow.addColorStop(0, `rgba(255, 240, 200, ${totalGlow * 0.15})`);
  glow.addColorStop(0.5, `rgba(200, 180, 150, ${totalGlow * 0.05})`);
  glow.addColorStop(1, 'rgba(150, 130, 110, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, size * pulse, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.fillStyle = 'rgba(6, 6, 8, 0.08)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  updateRelay(t);
  drawCenter(t);
  drawRunners(t);
  drawPassingLight(t);

  // Title
  const alpha = Math.min(0.35, t / 300);
  ctx.font = '16px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = `rgba(180, 175, 190, ${alpha})`;
  ctx.fillText('The Relay', canvas.width / 2, 35);

  if (t > 400) {
    const subAlpha = Math.min(0.2, (t - 400) / 800);
    ctx.font = '11px Georgia, serif';
    ctx.fillStyle = `rgba(150, 145, 160, ${subAlpha})`;
    ctx.fillText('Each light ignites the next and fades. The pattern continues.', canvas.width / 2, canvas.height - 20);
  }

  t++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
