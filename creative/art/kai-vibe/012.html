<!DOCTYPE html><html><head><title>012 — Wabi-Sabi</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#1a1815;display:flex;align-items:center;justify-content:center}
.bowl{width:160px;height:90px;border:2px solid rgba(140,120,90,0.25);border-radius:0 0 50% 50%;border-top:none;position:relative}
.crack{position:absolute;width:1px;height:40px;background:rgba(180,160,100,0.2);transform:rotate(15deg);top:20px;left:60px}
.gold{position:absolute;width:3px;height:3px;background:rgba(200,180,100,0.4);border-radius:50%;top:35px;left:61px}
</style></head>
<body><div class="bowl"><div class="crack"></div><div class="gold"></div></div></body></html>
