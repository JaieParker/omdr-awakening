<!DOCTYPE html><html><head><title>005 — Ink Drop</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#f0ebe2;display:flex;align-items:center;justify-content:center}
.drop{width:0;height:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1a1a1a,#0a0a0a);box-shadow:0 0 60px 30px rgba(15,12,10,0.15),0 0 120px 60px rgba(15,12,10,0.05);animation:bloom 4s ease-out forwards}
@keyframes bloom{0%{width:0;height:0;opacity:0}10%{opacity:1}100%{width:80px;height:80px}}</style>
</head><body><div class="drop"></div></body></html>
