<!DOCTYPE html><html><head><title>006 — Pulse</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#060608;display:flex;align-items:center;justify-content:center}
.pulse{width:20px;height:20px;border-radius:50%;background:rgba(196,149,106,0.6);animation:beat 2s ease-in-out infinite;box-shadow:0 0 20px rgba(196,149,106,0.2)}
@keyframes beat{0%,100%{transform:scale(1);opacity:0.6}15%{transform:scale(1.3);opacity:1}30%{transform:scale(1.1);opacity:0.8}45%{transform:scale(1.2);opacity:0.9}60%{transform:scale(1);opacity:0.6}}</style>
</head><body><div class="pulse"></div></body></html>
