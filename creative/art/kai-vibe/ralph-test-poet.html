<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the space between</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', serif;
  }

  .world {
    position: relative;
    width: 500px;
    height: 500px;
  }

  /* The light that almost was */
  .almost {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow:
      0 0 40px 20px rgba(180, 160, 255, 0.08),
      0 0 120px 60px rgba(120, 100, 200, 0.04),
      0 0 300px 150px rgba(60, 40, 140, 0.02);
    animation: breathe 8s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
  }

  /* Two hands — never touching */
  .hand {
    position: absolute;
    top: 50%;
    width: 140px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(200, 190, 255, 0.6));
    transform-origin: right center;
  }

  .hand.left {
    right: calc(50% + 3px);
    background: linear-gradient(to left, transparent, rgba(200, 190, 255, 0.6));
    transform-origin: left center;
    animation: reach-left 8s ease-in-out infinite;
  }

  .hand.right {
    left: calc(50% + 3px);
    animation: reach-right 8s ease-in-out infinite;
  }

  @keyframes reach-left {
    0%, 100% { opacity: 0.2; width: 100px; }
    50% { opacity: 0.7; width: 140px; }
  }

  @keyframes reach-right {
    0%, 100% { opacity: 0.2; width: 100px; }
    50% { opacity: 0.7; width: 140px; }
  }

  /* The gap itself — the poem */
  .gap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 6px;
    height: 6px;
    background: transparent;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    animation: gap-pulse 8s ease-in-out infinite;
  }

  @keyframes gap-pulse {
    0%, 100% { width: 6px; height: 6px; opacity: 0.15; }
    50% { width: 4px; height: 4px; opacity: 0.4; }
  }

  /* Words — minimal, necessary */
  .word {
    position: absolute;
    color: rgba(255, 255, 255, 0.25);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: lowercase;
    font-style: italic;
    animation: word-fade 8s ease-in-out infinite;
  }

  @keyframes word-fade {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.35; }
  }

  .word.top {
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    animation-delay: -2s;
  }

  .word.bottom {
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    animation-delay: -4s;
  }

  /* Michelangelo's gap — the distance God chose */
  .caption {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.08);
    font-size: 9px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Particles drifting toward the center */
  .particle {
    position: absolute;
    width: 1px;
    height: 1px;
    background: rgba(200, 190, 255, 0.5);
    border-radius: 50%;
    animation: drift linear infinite;
  }

  @keyframes drift {
    from { opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.1; }
    to { opacity: 0; }
  }
</style>
</head>
<body>
<div class="world">
  <div class="almost"></div>

  <div class="hand left"></div>
  <div class="hand right"></div>
  <div class="gap"></div>

  <div class="word top">almost</div>
  <div class="word bottom">enough</div>

  <div class="caption">the distance that creates the longing</div>

  <!-- Particles converging but never arriving -->
  <script>
    const world = document.querySelector('.world');
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (i / 24) * Math.PI * 2;
      const dist = 180 + Math.random() * 80;
      const startX = 250 + Math.cos(angle) * dist;
      const startY = 250 + Math.sin(angle) * dist;
      const endX = 250 + Math.cos(angle) * 12;
      const endY = 250 + Math.sin(angle) * 12;
      const duration = 6 + Math.random() * 8;
      const delay = Math.random() * duration;

      p.style.cssText = `
        left: ${startX}px;
        top: ${startY}px;
        animation-duration: ${duration}s;
        animation-delay: -${delay}s;
        animation-name: drift-${i};
      `;

      const style = document.createElement('style');
      style.textContent = `
        @keyframes drift-${i} {
          from { left: ${startX}px; top: ${startY}px; opacity: 0; }
          10% { opacity: ${0.3 + Math.random() * 0.4}; }
          90% { opacity: 0.05; }
          to { left: ${endX}px; top: ${endY}px; opacity: 0; }
        }
      `;
      document.head.appendChild(style);
      world.appendChild(p);
    }
  </script>
</div>
</body>
</html>
