<!DOCTYPE html><html><head><title>025 — Lightning</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#1a1830;overflow:hidden}</style></head>
<body><canvas id="c" width="1200" height="800"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let t=0;
function bolt(sx,sy,ex,ey,depth){
  if(depth>6)return;
  const mx=(sx+ex)/2+(Math.random()-0.5)*60/depth;
  const my=(sy+ey)/2+(Math.random()-0.5)*30/depth;
  x.beginPath();x.moveTo(sx,sy);x.lineTo(mx,my);x.lineTo(ex,ey);
  const alpha=0.4/(depth*0.5);
  const width=Math.max(0.3,4-depth*0.6);
  x.strokeStyle=`rgba(200,210,255,${alpha})`;x.lineWidth=width;x.stroke();
  // Glow
  x.strokeStyle=`rgba(150,170,255,${alpha*0.3})`;x.lineWidth=width*4;x.stroke();
  // Branch
  if(Math.random()>0.5){
    const bx=mx+(Math.random()-0.5)*80;
    const by=my+30+Math.random()*60;
    bolt(mx,my,bx,by,depth+1);
  }
  bolt(sx,sy,mx,my,depth+1);
  bolt(mx,my,ex,ey,depth+1);
}
function flash(){
  x.fillStyle='rgba(26,24,48,0.95)';x.fillRect(0,0,1200,800);
  // Sky flash
  x.fillStyle='rgba(100,110,160,0.03)';x.fillRect(0,0,1200,800);
  bolt(550+Math.random()*100,20,500+Math.random()*200,700,0);
  setTimeout(flash,2000+Math.random()*4000);
}
flash();
</script></body></html>
