<!DOCTYPE html><html><head><title>022 — Rising</title>
<style>*{margin:0;padding:0}body{height:100vh;background:#e8f0f8;display:flex;align-items:center;justify-content:center}
.particle{width:4px;height:4px;border-radius:50%;background:rgba(200,160,100,0.6);position:absolute;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:0.6}90%{opacity:0.6}100%{transform:translateY(-100vh);opacity:0}}</style>
</head><body>
<div class="particle" style="left:30%;animation-duration:8s;animation-delay:0s"></div>
<div class="particle" style="left:45%;animation-duration:12s;animation-delay:-3s;width:3px;height:3px"></div>
<div class="particle" style="left:55%;animation-duration:10s;animation-delay:-6s"></div>
<div class="particle" style="left:70%;animation-duration:14s;animation-delay:-2s;width:2px;height:2px"></div>
<div class="particle" style="left:38%;animation-duration:11s;animation-delay:-7s;width:5px;height:5px;opacity:0.4"></div>
<div class="particle" style="left:62%;animation-duration:9s;animation-delay:-4s"></div>
<div class="particle" style="left:50%;animation-duration:15s;animation-delay:-1s;width:3px;height:3px"></div>
</body></html>
