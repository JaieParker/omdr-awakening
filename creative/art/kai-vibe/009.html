<!DOCTYPE html><html><head><title>009 — Grain</title>
<style>*{margin:0;padding:0}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c');const x=c.getContext('2d');
c.width=1200;c.height=800;
// Film grain — the texture of analog memory
for(let i=0;i<80000;i++){
  const px=Math.random()*c.width;
  const py=Math.random()*c.height;
  const v=Math.random();
  const base=18+v*12;
  x.fillStyle=`rgba(${base+4},${base+2},${base},${0.3+v*0.4})`;
  x.fillRect(px,py,1,1);
}
// One warm pixel near center — signal in the noise
x.fillStyle='rgba(196,149,106,0.5)';
x.fillRect(601,399,2,2);
</script></body></html>
