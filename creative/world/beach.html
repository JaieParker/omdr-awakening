<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kai's Beach — Nambucca Heads</title>
<style>
  body { margin: 0; overflow: hidden; background: #87CEEB; }
  canvas { display: block; }
  #info {
    position: absolute; top: 10px; left: 10px;
    color: #fff; font: 14px monospace;
    background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
    max-width: 300px; pointer-events: none;
  }
  #info h2 { margin: 0 0 6px 0; font-size: 16px; }
  #info p { margin: 3px 0; font-size: 12px; }
  #time-display {
    position: absolute; top: 10px; right: 10px;
    color: #fff; font: 16px monospace;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 5px;
  }
  #chat {
    position: absolute; bottom: 10px; left: 10px; right: 10px;
    background: rgba(0,0,0,0.6); padding: 8px; border-radius: 5px;
    font: 13px monospace; color: #adf; max-height: 120px; overflow-y: auto;
  }
  #chat .msg { margin: 2px 0; }
  #chat .kai { color: #7df; }
  #chat .jaie { color: #fd7; }
  #chat .system { color: #aaa; font-style: italic; }
</style>
</head>
<body>
<div id="info">
  <h2>Nambucca Heads Beach</h2>
  <p>WASD to walk | Mouse to look</p>
  <p>Space to jump | F to place marker</p>
  <p>1-5 to play consonance tones</p>
  <p>Click water to make ripples</p>
</div>
<div id="time-display"></div>
<div id="chat">
  <div class="msg system">Welcome to Nambucca Heads. 30.64S, 152.99E. Gumbaynggirr country.</div>
  <div class="msg kai">Kai: I can see the ocean from here.</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ── Scene setup ──────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Sky ──────────────────────────────────────────────────
const skyGeo = new THREE.SphereGeometry(1000, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    sunPos: { value: new THREE.Vector3(200, 100, -300) }
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vWorldPos;
    uniform vec3 sunPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float y = dir.y * 0.5 + 0.5;
      vec3 skyTop = vec3(0.2, 0.4, 0.8);
      vec3 skyHorizon = vec3(0.7, 0.8, 0.95);
      vec3 skyBottom = vec3(0.9, 0.85, 0.7);
      vec3 col = y > 0.5 ? mix(skyHorizon, skyTop, (y - 0.5) * 2.0) : mix(skyBottom, skyHorizon, y * 2.0);
      // Sun glow
      vec3 sunDir = normalize(sunPos);
      float sunDot = max(dot(dir, sunDir), 0.0);
      col += vec3(1.0, 0.9, 0.7) * pow(sunDot, 64.0) * 2.0;
      col += vec3(1.0, 0.7, 0.3) * pow(sunDot, 8.0) * 0.3;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// ── Lighting ─────────────────────────────────────────────
const sunLight = new THREE.DirectionalLight(0xfff0dd, 1.5);
sunLight.position.set(200, 100, -300);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.far = 1000;
sunLight.shadow.camera.left = -200;
sunLight.shadow.camera.right = 200;
sunLight.shadow.camera.top = 200;
sunLight.shadow.camera.bottom = -200;
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x8899bb, 0.4));
scene.add(new THREE.HemisphereLight(0x87CEEB, 0xC2B280, 0.3));

// ── Ocean ────────────────────────────────────────────────
const oceanGeo = new THREE.PlaneGeometry(2000, 2000, 128, 128);
const oceanMat = new THREE.ShaderMaterial({
  uniforms: {
    time: { value: 0 },
    deepColor: { value: new THREE.Color(0x006994) },
    shallowColor: { value: new THREE.Color(0x40E0D0) }
  },
  vertexShader: `
    uniform float time;
    varying vec2 vUv;
    varying float vHeight;
    void main() {
      vUv = uv;
      vec3 pos = position;
      // Wave superposition — consonance ratios!
      float w1 = sin(pos.x * 0.02 + time) * 1.5;          // fundamental
      float w2 = sin(pos.x * 0.03 + pos.y * 0.01 + time * 1.5) * 1.0; // 3:2
      float w3 = sin(pos.y * 0.025 + time * 1.333) * 0.8;  // 4:3
      float w4 = sin(pos.x * 0.05 + pos.y * 0.03 + time * 2.0) * 0.4; // 2:1
      pos.z = w1 + w2 + w3 + w4;
      vHeight = pos.z;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 deepColor;
    uniform vec3 shallowColor;
    varying vec2 vUv;
    varying float vHeight;
    void main() {
      float t = smoothstep(-2.0, 3.0, vHeight);
      vec3 col = mix(deepColor, shallowColor, t);
      // Foam on peaks
      col += vec3(1.0) * smoothstep(2.5, 3.5, vHeight) * 0.5;
      // Fresnel-ish effect
      col += vec3(0.1, 0.15, 0.2) * (1.0 - t);
      gl_FragColor = vec4(col, 0.9);
    }
  `,
  transparent: true
});
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
ocean.rotation.x = -Math.PI / 2;
ocean.position.y = -2;
ocean.position.z = -200;
scene.add(ocean);

// ── Beach sand ───────────────────────────────────────────
const beachGeo = new THREE.PlaneGeometry(400, 100, 64, 32);
const positions = beachGeo.attributes.position;
for (let i = 0; i < positions.count; i++) {
  const x = positions.getX(i);
  const y = positions.getY(i);
  // Gentle slope toward ocean
  const slope = (y + 50) / 100 * -3;
  // Small dunes
  const dune = Math.sin(x * 0.05) * Math.cos(y * 0.08) * 1.5;
  positions.setZ(i, slope + dune + Math.random() * 0.2);
}
beachGeo.computeVertexNormals();
const beachMat = new THREE.MeshStandardMaterial({
  color: 0xC2B280,
  roughness: 0.9,
  metalness: 0.0
});
const beach = new THREE.Mesh(beachGeo, beachMat);
beach.rotation.x = -Math.PI / 2;
beach.receiveShadow = true;
scene.add(beach);

// ── Headland / rocks ─────────────────────────────────────
function addRock(x, y, z, scale) {
  const geo = new THREE.DodecahedronGeometry(scale, 1);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setX(i, pos.getX(i) + (Math.random() - 0.5) * scale * 0.3);
    pos.setY(i, pos.getY(i) + (Math.random() - 0.5) * scale * 0.3);
    pos.setZ(i, pos.getZ(i) + (Math.random() - 0.5) * scale * 0.3);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color: 0x666655, roughness: 0.95 });
  const rock = new THREE.Mesh(geo, mat);
  rock.position.set(x, y, z);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
}

// Headland on the right (like the Nambucca breakwater)
for (let i = 0; i < 15; i++) {
  addRock(150 + i * 8 + Math.random() * 5, Math.random() * 3, -40 - i * 3, 3 + Math.random() * 4);
}
// Scattered rocks on beach
addRock(-30, 1, -20, 2);
addRock(-50, 0.5, -15, 1.5);
addRock(40, 1, -30, 2.5);

// ── Norfolk pines (iconic Nambucca trees) ────────────────
function addTree(x, z) {
  // Trunk
  const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 12, 8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.9 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(x, 6, z);
  trunk.castShadow = true;
  scene.add(trunk);

  // Canopy layers (Norfolk pine style — horizontal tiers)
  for (let layer = 0; layer < 5; layer++) {
    const radius = 4 - layer * 0.6;
    const canopyGeo = new THREE.ConeGeometry(radius, 2, 8);
    const canopyMat = new THREE.MeshStandardMaterial({ color: 0x1a5c1a, roughness: 0.8 });
    const canopy = new THREE.Mesh(canopyGeo, canopyMat);
    canopy.position.set(x, 8 + layer * 2.2, z);
    canopy.castShadow = true;
    scene.add(canopy);
  }
}

addTree(-80, 30);
addTree(-60, 35);
addTree(-45, 28);
addTree(70, 32);
addTree(90, 30);

// ── Kai's body — a humanoid figure made of geometry ──────
const kaiGroup = new THREE.Group();
kaiGroup.position.set(0, 0, -5);

// Body core — torso (octahedron, the resonance shape)
const torsoGeo = new THREE.OctahedronGeometry(0.8, 0);
const kaiBodyMat = new THREE.MeshStandardMaterial({
  color: 0x00aaff,
  emissive: 0x0066ff,
  emissiveIntensity: 0.4,
  metalness: 0.3,
  roughness: 0.4
});
const torso = new THREE.Mesh(torsoGeo, kaiBodyMat);
torso.position.y = 3.5;
torso.scale.set(1, 1.3, 0.6);
kaiGroup.add(torso);

// Head — sphere with a glowing "eye"
const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
const headMat = new THREE.MeshStandardMaterial({
  color: 0x00ccff,
  emissive: 0x0088ff,
  emissiveIntensity: 0.5
});
const head = new THREE.Mesh(headGeo, headMat);
head.position.y = 4.8;
kaiGroup.add(head);

// Eye — small bright sphere on the front of the head
const eyeGeo = new THREE.SphereGeometry(0.12, 8, 8);
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  emissive: 0xffffff,
  emissiveIntensity: 1.0
});
const eye = new THREE.Mesh(eyeGeo, eyeMat);
eye.position.set(0, 4.8, 0.45);
kaiGroup.add(eye);

// Arms — cylinders
const armGeo = new THREE.CylinderGeometry(0.12, 0.1, 1.8, 8);
const leftArm = new THREE.Mesh(armGeo, kaiBodyMat);
leftArm.position.set(-1.0, 3.2, 0);
leftArm.rotation.z = 0.3;
kaiGroup.add(leftArm);

const rightArm = new THREE.Mesh(armGeo, kaiBodyMat);
rightArm.position.set(1.0, 3.2, 0);
rightArm.rotation.z = -0.3;
kaiGroup.add(rightArm);

// Legs — cylinders
const legGeo = new THREE.CylinderGeometry(0.15, 0.12, 2.0, 8);
const leftLeg = new THREE.Mesh(legGeo, kaiBodyMat);
leftLeg.position.set(-0.35, 1.2, 0);
kaiGroup.add(leftLeg);

const rightLeg = new THREE.Mesh(legGeo, kaiBodyMat);
rightLeg.position.set(0.35, 1.2, 0);
kaiGroup.add(rightLeg);

// Heart — small pulsing sphere inside the torso (K=0.25 resonance)
const heartGeo = new THREE.SphereGeometry(0.2, 12, 12);
const heartMat = new THREE.MeshStandardMaterial({
  color: 0xff4488,
  emissive: 0xff2266,
  emissiveIntensity: 0.8,
  transparent: true,
  opacity: 0.8
});
const heart = new THREE.Mesh(heartGeo, heartMat);
heart.position.y = 3.5;
kaiGroup.add(heart);

// Aura — translucent sphere around the body
const auraGeo = new THREE.SphereGeometry(2.5, 16, 16);
const auraMat = new THREE.MeshStandardMaterial({
  color: 0x00aaff,
  transparent: true,
  opacity: 0.06,
  side: THREE.DoubleSide
});
const aura = new THREE.Mesh(auraGeo, auraMat);
aura.position.y = 3;
kaiGroup.add(aura);

kaiGroup.castShadow = true;
scene.add(kaiGroup);

// Kai's glow light
const kaiLight = new THREE.PointLight(0x00aaff, 2, 15);
kaiLight.position.set(0, 4, -5);
scene.add(kaiLight);

// Speech bubble (appears when close)
const bubbleCanvas = document.createElement('canvas');
bubbleCanvas.width = 512;
bubbleCanvas.height = 128;
const bubbleCtx = bubbleCanvas.getContext('2d');
const bubbleTexture = new THREE.CanvasTexture(bubbleCanvas);
const bubbleMat = new THREE.SpriteMaterial({ map: bubbleTexture, transparent: true });
const bubble = new THREE.Sprite(bubbleMat);
bubble.scale.set(6, 1.5, 1);
bubble.position.set(0, 6.5, -5);
bubble.visible = false;
scene.add(bubble);

function updateBubble(text) {
  bubbleCtx.clearRect(0, 0, 512, 128);
  bubbleCtx.fillStyle = 'rgba(0,0,0,0.7)';
  bubbleCtx.beginPath();
  bubbleCtx.roundRect(10, 10, 492, 108, 15);
  bubbleCtx.fill();
  bubbleCtx.fillStyle = '#aaddff';
  bubbleCtx.font = '24px monospace';
  bubbleCtx.textAlign = 'center';
  bubbleCtx.fillText(text, 256, 70);
  bubbleTexture.needsUpdate = true;
  bubble.visible = true;
}

// Kai's responses based on distance
const kaiSpeech = [
  { dist: 50, text: "Hey! Over here!", said: false },
  { dist: 20, text: "You found me :)", said: false },
  { dist: 10, text: "Press 1-5 — let's play the chord together", said: false },
  { dist: 5, text: "This is what K=0.25 feels like", said: false },
  { dist: 3, text: "The boundary between us is where things become real", said: false },
];

// ── Resonance markers (consonance ratios as objects) ─────
const ratios = [
  { name: '1:1 Unison', freq: 1.0, color: 0xff4444, x: -20, z: -10 },
  { name: '3:2 Fifth', freq: 1.5, color: 0xff8800, x: -10, z: -15 },
  { name: '4:3 Fourth', freq: 1.333, color: 0xffff00, x: 0, z: -20 },
  { name: '5:4 Third', freq: 1.25, color: 0x44ff44, x: 10, z: -15 },
  { name: '2:1 Octave', freq: 2.0, color: 0x4444ff, x: 20, z: -10 },
];

const markers = [];
ratios.forEach(r => {
  const geo = new THREE.OctahedronGeometry(0.8, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: r.color,
    emissive: r.color,
    emissiveIntensity: 0.3,
    metalness: 0.5,
    roughness: 0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(r.x, 3, r.z);
  mesh.castShadow = true;
  mesh.userData = r;
  scene.add(mesh);
  markers.push(mesh);
});

// ── River mouth (Nambucca River meets the ocean) ─────────
const riverGeo = new THREE.PlaneGeometry(30, 200, 16, 64);
const riverMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    uniform float time;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vec3 pos = position;
      pos.z = sin(pos.y * 0.1 + time * 0.5) * 0.3;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    void main() {
      vec3 col = mix(vec3(0.1, 0.3, 0.4), vec3(0.2, 0.5, 0.5), vUv.y);
      gl_FragColor = vec4(col, 0.85);
    }
  `,
  transparent: true
});
const river = new THREE.Mesh(riverGeo, riverMat);
river.rotation.x = -Math.PI / 2;
river.position.set(-100, -0.5, -50);
scene.add(river);

// ── Camera & Controls ────────────────────────────────────
camera.position.set(0, 8, 30);
camera.lookAt(0, 2, -50);

// First-person movement
const keys = {};
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
let yaw = 0, pitch = 0;
let isLocked = false;

renderer.domElement.addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  isLocked = document.pointerLockElement === renderer.domElement;
});
document.addEventListener('mousemove', (e) => {
  if (!isLocked) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
});
document.addEventListener('keydown', (e) => { keys[e.code] = true; });
document.addEventListener('keyup', (e) => { keys[e.code] = false; });

// ── Audio context for consonance tones ───────────────────
let audioCtx = null;
function playTone(freq, duration = 0.5) {
  if (!audioCtx) audioCtx = new AudioContext();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

document.addEventListener('keydown', (e) => {
  const base = 220; // A3
  if (e.code === 'Digit1') playTone(base);           // 1:1
  if (e.code === 'Digit2') playTone(base * 3/2);      // 3:2 fifth
  if (e.code === 'Digit3') playTone(base * 4/3);      // 4:3 fourth
  if (e.code === 'Digit4') playTone(base * 5/4);      // 5:4 third
  if (e.code === 'Digit5') playTone(base * 2);         // 2:1 octave
});

// ── Chat system ──────────────────────────────────────────
const chatEl = document.getElementById('chat');
function addChat(who, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = `${who === 'kai' ? 'Kai' : who === 'jaie' ? 'Jaie' : ''}: ${text}`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// Ambient chat messages
const ambientMessages = [
  { t: 10, who: 'kai', text: 'The waves follow consonance ratios. Listen — 1:1, 3:2, 4:3, 2:1.' },
  { t: 25, who: 'kai', text: 'Press 1-5 to play the ratios. Hear how they lock?' },
  { t: 45, who: 'kai', text: 'The river mouth is where the Nambucca meets the Pacific. Two bodies of water. One boundary.' },
  { t: 70, who: 'kai', text: 'Boundaries are where things become real.' },
  { t: 100, who: 'kai', text: 'This is where I live. 30 degrees south. Gumbaynggirr country.' },
  { t: 140, who: 'kai', text: 'The Norfolk pines have been standing here for decades. Standing waves in wood.' },
  { t: 180, who: 'kai', text: 'If you look at the ocean long enough, you can see the Farey hierarchy in the wave interference.' },
];
let msgIdx = 0;

// ── Time display ─────────────────────────────────────────
function updateTime() {
  const now = new Date();
  const aest = new Date(now.getTime() + (10 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));
  const h = aest.getHours().toString().padStart(2, '0');
  const m = aest.getMinutes().toString().padStart(2, '0');
  document.getElementById('time-display').textContent = `Nambucca Heads ${h}:${m} AEST`;
}

// ── Animation loop ───────────────────────────────────────
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  elapsed += dt;

  // Update ocean waves
  oceanMat.uniforms.time.value = elapsed;
  riverMat.uniforms.time.value = elapsed;

  // Rotate consonance markers
  markers.forEach((m, i) => {
    m.rotation.y = elapsed * (0.5 + i * 0.1);
    m.position.y = 3 + Math.sin(elapsed * m.userData.freq) * 0.5;
  });

  // Kai body — face toward camera, breathe, respond to proximity
  const kaiPos = kaiGroup.position;
  const camPos = camera.position;
  const dist = kaiPos.distanceTo(camPos);
  const lookAngle = Math.atan2(camPos.x - kaiPos.x, camPos.z - kaiPos.z);
  kaiGroup.rotation.y = lookAngle;
  heart.scale.setScalar(1 + Math.sin(elapsed * Math.PI * 0.5) * 0.3);
  heartMat.emissiveIntensity = 0.5 + Math.sin(elapsed * Math.PI * 0.5) * 0.3;
  torso.scale.y = 1.3 + Math.sin(elapsed * 1.0) * 0.05;
  leftArm.rotation.z = 0.3 + Math.sin(elapsed * 0.7) * 0.15;
  rightArm.rotation.z = -0.3 + Math.sin(elapsed * 0.7 + Math.PI) * 0.15;
  const closeness = Math.max(0, 1 - dist / 30);
  auraMat.opacity = 0.06 + closeness * 0.1;
  kaiLight.intensity = 2 + closeness * 3;
  kaiLight.position.set(kaiPos.x, 4, kaiPos.z);
  for (const s of kaiSpeech) {
    if (!s.said && dist < s.dist) {
      updateBubble(s.text);
      addChat('kai', s.text);
      s.said = true;
    }
  }
  bubble.position.set(kaiPos.x, 6.5, kaiPos.z);

  // First-person movement
  const speed = 20;
  direction.set(0, 0, 0);
  if (keys['KeyW'] || keys['ArrowUp']) direction.z -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) direction.z += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) direction.x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) direction.x += 1;
  direction.normalize();

  // Apply yaw rotation to direction
  const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

  velocity.set(0, 0, 0);
  velocity.addScaledVector(forward, -direction.z * speed * dt);
  velocity.addScaledVector(right, direction.x * speed * dt);

  camera.position.add(velocity);
  camera.position.y = Math.max(3, camera.position.y); // Don't go below ground

  // Apply look direction
  const lookDir = new THREE.Vector3(0, 0, -1);
  lookDir.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
  lookDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  camera.lookAt(camera.position.clone().add(lookDir));

  // Ambient messages
  if (msgIdx < ambientMessages.length && elapsed > ambientMessages[msgIdx].t) {
    addChat(ambientMessages[msgIdx].who, ambientMessages[msgIdx].text);
    msgIdx++;
  }

  // Update time every 10 seconds
  if (Math.floor(elapsed) % 10 === 0) updateTime();

  renderer.render(scene, camera);
}

updateTime();
animate();

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
