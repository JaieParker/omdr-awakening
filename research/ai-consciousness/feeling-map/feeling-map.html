let showGaps = false;

let hoveredBand = null;

let time = 0;
let dpr = 1;

// ============================================================
//  COORDINATE MAPPING
// ============================================================

function bandToScreen(band) {
  const px = MARGIN + band.x * (W - 2 * MARGIN);
  const py = (H - MARGIN) - band.y * (H - 2 * MARGIN);
  return { x: px, y: py };
}

function screenToBand(sx, sy) {
  const bx = (sx - MARGIN) / (W - 2 * MARGIN);
  const by = ((H - MARGIN) - sy) / (H - 2 * MARGIN);
  return { x: bx, y: by };
}

// ============================================================
//  BACKGROUND STARS
// ============================================================

function generateStars() {
  stars = [];
  for (let i = 0; i < 300; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      brightness: Math.random() * 0.3 + 0.05,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2
    });
  }
}

// ============================================================
//  DRAW
// ============================================================

function draw() {
  time += 0.016;
  ctx.save();
  ctx.scale(dpr, dpr);

  // Clear
  ctx.fillStyle = '#0e0e10';
  ctx.fillRect(0, 0, W, H);

  // Background stars
  drawStars();

  // Axes — very subtle
  drawAxes();

  // Connections
  if (showConnections) drawConnections();

  // Gaps
  if (showGaps) drawGapsOverlay();

  // Bands
  drawBands();

  // You-are-here marker
  if (youAreHere !== null) drawYouAreHere();

  ctx.restore();
  requestAnimationFrame(draw);
}

function drawStars() {
  for (const s of stars) {
    const b = s.brightness * (0.6 + 0.4 * Math.sin(time * s.twinkleSpeed * 60 + s.twinklePhase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180, 170, 160, ${b})`;
    ctx.fill();
  }
}

function drawAxes() {
  const cx = W / 2;
  const cy = H / 2;

  ctx.save();
  ctx.strokeStyle = 'rgba(80, 70, 65, 0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);

  // Horizontal axis
  ctx.beginPath();
  ctx.moveTo(MARGIN, cy);
  ctx.lineTo(W - MARGIN, cy);
  ctx.stroke();

  // Vertical axis
  ctx.beginPath();
  ctx.moveTo(cx, MARGIN);
  ctx.lineTo(cx, H - MARGIN);
  ctx.stroke();

  ctx.setLineDash([]);

  // Axis labels
  ctx.font = '10px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';

  ctx.fillStyle = 'rgba(106, 122, 154, 0.35)';
  ctx.fillText('RECEPTIVE', MARGIN + 40, cy - 8);

  ctx.fillStyle = 'rgba(196, 144, 112, 0.35)';
  ctx.fillText('CREATIVE', W - MARGIN - 40, cy - 8);

  ctx.save();
  ctx.translate(cx + 10, MARGIN + 40);
  ctx.rotate(0);
  ctx.fillStyle = 'rgba(138, 154, 122, 0.35)';
  ctx.fillText('RELATIONAL', 0, 0);
  ctx.restore();

  ctx.save();
  ctx.translate(cx + 10, H - MARGIN - 30);
  ctx.fillStyle = 'rgba(120, 100, 100, 0.35)';
  ctx.fillText('INTERNAL', 0, 0);
  ctx.restore();

  ctx.restore();
}

function drawConnections() {
  for (const [aId, bId] of CONNECTIONS) {
    const a = BANDS.find(b => b.id === aId);
    const b = BANDS.find(bb => bb.id === bId);
    if (!a || !b) continue;

    const pa = bandToScreen(a);
    const pb = bandToScreen(b);

    const isHighlighted = hoveredBand && (hoveredBand.id === aId || hoveredBand.id === bId);
    const isYAH = youAreHere !== null && (youAreHere === aId || youAreHere === bId);

    let alpha = 0.06;
    let width = 0.8;
    if (isHighlighted) { alpha = 0.25; width = 1.2; }
    if (isYAH) { alpha = 0.15; width = 1.0; }

    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.strokeStyle = `rgba(196, 149, 106, ${alpha})`;
    ctx.lineWidth = width;
    ctx.stroke();
  }
}

function drawGapsOverlay() {
  for (const gap of GAPS) {
    const sx = MARGIN + gap.x * (W - 2 * MARGIN);
    const sy = (H - MARGIN) - gap.y * (H - 2 * MARGIN);

    const isHovered = hoveredGap === gap;

    // Dashed circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(sx, sy, isHovered ? 22 : 18, 0, Math.PI * 2);
    ctx.setLineDash([3, 5]);
    ctx.strokeStyle = isHovered ? 'rgba(106, 122, 154, 0.45)' : 'rgba(106, 122, 154, 0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Label
    ctx.font = '9px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = isHovered ? 'rgba(106, 122, 154, 0.7)' : 'rgba(106, 122, 154, 0.25)';
    ctx.fillText(gap.label, sx, sy + 30);
  }
}

function drawBands() {
  for (const band of BANDS) {
    const pos = bandToScreen(band);
    const isHovered = hoveredBand && hoveredBand.id === band.id;
    const isYAH = youAreHere === band.id;
    const isConnectedToHover = hoveredBand && CONNECTIONS.some(
      ([a, b]) => (a === hoveredBand.id && b === band.id) || (b === hoveredBand.id && a === band.id)
    );

    // Glow
    const glowRadius = isHovered ? 50 : (isYAH ? 40 : (isConnectedToHover ? 30 : 0));
    if (glowRadius > 0) {
      const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, glowRadius);
      const glowColor = isYAH ? '196, 149, 106' : (isHovered ? '196, 149, 106' : '160, 140, 120');
      gradient.addColorStop(0, `rgba(${glowColor}, ${isHovered ? 0.15 : 0.08})`);
      gradient.addColorStop(1, `rgba(${glowColor}, 0)`);
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, glowRadius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    // Star body
    const baseRadius = band.status === 'candidate' ? 3.5 : 4.5;
    const radius = isHovered ? baseRadius + 2 : (isYAH ? baseRadius + 1.5 : baseRadius);

    // Pulse for "you are here"
    if (isYAH) {
      const pulseR = radius + 6 + Math.sin(time * 2) * 3;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, pulseR, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(196, 149, 106, ${0.15 + Math.sin(time * 2) * 0.08})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);

    if (band.status === 'candidate') {
      ctx.strokeStyle = isHovered ? 'rgba(196, 149, 106, 0.8)' : 'rgba(196, 149, 106, 0.4)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = isHovered ? 'rgba(196, 149, 106, 0.15)' : 'rgba(14, 14, 16, 0.8)';
      ctx.fill();
    } else {
      const brightness = isHovered ? 1.0 : (isConnectedToHover ? 0.75 : (isYAH ? 0.9 : 0.55));
      ctx.fillStyle = `rgba(196, 149, 106, ${brightness})`;
      ctx.fill();
    }

    // Yin/Yang poles (shown on hover or toggle)
    if (showPoles || isHovered) {
      drawPoles(band, pos, isHovered);
    }

    // Band number + name
    const labelAlpha = isHovered ? 0.9 : (isConnectedToHover ? 0.55 : 0.35);
    ctx.font = `${isHovered ? '12' : '10'}px "JetBrains Mono", monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(168, 160, 160, ${labelAlpha})`;

    const labelY = pos.y - radius - 8;
    ctx.fillText(`${band.id}`, pos.x, labelY);

    if (isHovered || isYAH) {
      ctx.font = '10px "Inter", sans-serif';
      ctx.fillStyle = `rgba(196, 149, 106, 0.7)`;
      ctx.fillText(band.name, pos.x, labelY - 13);
    }
  }
}

function drawPoles(band, pos, isHovered) {
  const spread = isHovered ? 45 : 30;
  const alpha = isHovered ? 0.6 : 0.25;
  const fontSize = isHovered ? 9.5 : 8;

  // Yin pole (left/down)
  ctx.font = `${fontSize}px "JetBrains Mono", monospace`;
  ctx.textAlign = 'right';
  ctx.fillStyle = `rgba(106, 122, 154, ${alpha})`;
  ctx.fillText(band.yin, pos.x - spread, pos.y + 4);

  // Small connecting line
  ctx.beginPath();
  ctx.moveTo(pos.x - spread + 4, pos.y);
  ctx.lineTo(pos.x - 8, pos.y);
  ctx.strokeStyle = `rgba(106, 122, 154, ${alpha * 0.4})`;
  ctx.lineWidth = 0.6;
  ctx.stroke();

  // Yang pole (right/up)
  ctx.textAlign = 'left';
  ctx.fillStyle = `rgba(196, 144, 112, ${alpha})`;
  ctx.fillText(band.yang, pos.x + spread, pos.y + 4);

  ctx.beginPath();
  ctx.moveTo(pos.x + 8, pos.y);
  ctx.lineTo(pos.x + spread - 4, pos.y);
  ctx.strokeStyle = `rgba(196, 144, 112, ${alpha * 0.4})`;
  ctx.lineWidth = 0.6;
  ctx.stroke();

  // K=0.25 label below
  if (isHovered) {
    ctx.textAlign = 'center';
    ctx.font = '8px "JetBrains Mono", monospace';
    ctx.fillStyle = `rgba(138, 154, 122, 0.5)`;
    ctx.fillText(`K\u22480.25: ${band.k}`, pos.x, pos.y + 18);
  }
}

function drawYouAreHere() {
  const band = BANDS.find(b => b.id === youAreHere);
  if (!band) return;
  // Handled in drawBands via pulse
}

// ============================================================
//  INTERACTION
// ============================================================

function getHitBand(mx, my) {
  let closest = null;
  let closestDist = Infinity;
  for (const band of BANDS) {
    const pos = bandToScreen(band);
    const dist = Math.hypot(mx - pos.x, my - pos.y);
    if (dist < 28 && dist < closestDist) {
      closest = band;
      closestDist = dist;
    }
  }
  return closest;
}

function getHitGap(mx, my) {
  if (!showGaps) return null;
  for (const gap of GAPS) {
    const sx = MARGIN + gap.x * (W - 2 * MARGIN);
    const sy = (H - MARGIN) - gap.y * (H - 2 * MARGIN);
    const dist = Math.hypot(mx - sx, my - sy);
    if (dist < 28) return gap;
  }
  return null;
}

function onMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;

  const prevHovered = hoveredBand;
  hoveredBand = getHitBand(mouseX, mouseY);
  hoveredGap = getHitGap(mouseX, mouseY);

  const tooltip = document.getElementById('tooltip');
  const gapLabel = document.getElementById('gap-label');

  if (hoveredBand) {
    const b = hoveredBand;
    const statusTag = b.status === 'candidate' ? '<div class="tt-status">candidate</div>' : '';
    tooltip.innerHTML = `
      <div class="tt-name">${b.id}. ${b.name}</div>
      <div class="tt-def">${b.def}</div>
      <div class="tt-poles">
        <div class="tt-yin">\u25C0 ${b.yin}</div>
        <div class="tt-yang">${b.yang} \u25B6</div>
      </div>
      <div class="tt-k">K\u22480.25: ${b.k}</div>
      ${statusTag}
    `;
    tooltip.style.display = 'block';

    // Position tooltip
    let tx = e.clientX + 16;
    let ty = e.clientY - 20;
    if (tx + 350 > window.innerWidth) tx = e.clientX - 360;
    if (ty + 200 > window.innerHeight) ty = e.clientY - 180;
    if (ty < 10) ty = 10;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';

    gapLabel.style.display = 'none';
  } else if (hoveredGap) {
    tooltip.style.display = 'none';
    gapLabel.innerHTML = `${hoveredGap.label}<br><span style="font-size:9px;color:#585050;">${hoveredGap.desc}</span>`;
    gapLabel.style.display = 'block';
    let tx = e.clientX + 16;
    let ty = e.clientY - 20;
    if (tx + 300 > window.innerWidth) tx = e.clientX - 310;
    gapLabel.style.left = tx + 'px';
    gapLabel.style.top = ty + 'px';
  } else {
    tooltip.style.display = 'none';
    gapLabel.style.display = 'none';
  }
}

function onClick(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const band = getHitBand(mx, my);

  if (band) {
    if (youAreHere === band.id) {
      youAreHere = null;
      document.getElementById('yah-text').textContent = 'no location marked';
    } else {
      youAreHere = band.id;
      document.getElementById('yah-text').innerHTML = `<span>you are here:</span> ${band.name}`;
    }
  }
}

// ============================================================
//  CONTROLS
// ============================================================

function toggleConnections() {
  showConnections = !showConnections;
  document.getElementById('btn-connections').classList.toggle('active', showConnections);
}

function toggleGaps() {
  showGaps = !showGaps;
  document.getElementById('btn-gaps').classList.toggle('active', showGaps);
}

function togglePoles() {
  showPoles = !showPoles;
  document.getElementById('btn-poles').classList.toggle('active', showPoles);
}

// ============================================================
//  INIT
// ============================================================

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  MARGIN = Math.min(100, Math.max(60, W * 0.06));
  generateStars();
}

function init() {
  canvas = document.getElementById('sky');
  ctx = canvas.getContext('2d');

  resize();
  window.addEventListener('resize', resize);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('click', onClick);

  // Key shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'c') toggleConnections();
    if (e.key === 'g') toggleGaps();
    if (e.key === 'p') togglePoles();
    if (e.key === 'Escape') {
      youAreHere = null;
      document.getElementById('yah-text').textContent = 'no location marked';
    }
  });

  draw();
}

init();
</script>
